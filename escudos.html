<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego del Escudo Añicos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Fondo oscuro */
            overflow: hidden; /* Evita scroll bars */
            font-family: sans-serif;
            color: white;
            flex-direction: column;
        }

        #game-container {
            position: relative;
            width: 300px; /* Tamaño del escudo */
            height: 400px; /* Alto proporcional */
        }

        /* La imagen original se usa como base para la composición */
        #original-shield {
            width: 100%;
            height: 100%;
            display: none; /* Se oculta para usar sus fragmentos */
        }

        /* Contenedor para los fragmentos */
        #shatter-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Estilo para los fragmentos individuales */
        .fragment {
            position: absolute;
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 125"><path fill="none" stroke="%23007acc" stroke-width="2" d="M30 15 a20 10 0 0 1 40 0 L 80 15 L 80 25 L 100 25 L 100 120 L 0 120 L 0 25 L 20 25 L 20 15 Z" /><path fill="none" stroke="%23007acc" stroke-width="2" d="M 0 50 Q 50 10 100 50 M 2 55 a 1 1 0 0 1 0 25 m 96 0 a 1 1 0 0 1 0 -25" /><path fill="none" stroke="%23007acc" stroke-width="2" d="M 30 75 a 5 5 0 0 1 10 0 L 40 85 Q 40 90 35 90 Q 30 90 30 85 Z M 40 75 a 5 5 0 0 0 10 0 L 50 85 Q 50 90 45 90 Q 40 90 40 85 Z M 40 50 Q 50 40 60 50 Q 50 60 40 50" /><path fill="none" stroke="%23007acc" stroke-width="1.5" d="M 12 100 l 3 15 m -1 2 l 10 -5 m -10 5 l -3 -15 M 88 100 l -3 15 m 1 -2 l -10 -5 m 10 5 l 3 -15" /><path fill="none" stroke="%23007acc" stroke-width="2" d="M 0 110 Q 25 100 50 110 Q 75 120 100 110" /></svg>');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            transition: transform 0.2s linear, opacity 0.2s linear;
            will-change: transform, opacity;
        }

        #instructions {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
        }

        #request-permission-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            display: none; /* Se muestra solo si es necesario */
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="shatter-field"></div>
    </div>

    <div id="instructions">¡Agita tu móvil para romper el escudo!</div>
    <button id="request-permission-btn">Habilitar Sensor de Movimiento</button>

    <script>
        // --- Configuración y Datos ---
        // Usamos una recreación del SVG para poder manipularlo como fragmentos.
        // La URL de background-image en CSS ya tiene el SVG.

        const numFragments = 80; // Número de añicos
        const fragments = [];
        const shatterField = document.getElementById('shatter-field');
        const originalWidth = 100;
        const originalHeight = 125;
        let originalPositions = [];

        // --- Inicialización de los Añicos ---
        function initFragments() {
            // No podemos cortar un SVG fácilmente con JS puro sin lienzo (canvas),
            // así que recreamos el efecto cubriendo el área con pequeñas copias de la forma base
            // y luego dándoles posiciones y rotaciones aleatorias.
            for (let i = 0; i < numFragments; i++) {
                const fragment = document.createElement('div');
                fragment.className = 'fragment';
                
                // Tamaño aleatorio para los fragmentos
                const size = 20 + Math.random() * 30; // 20px a 50px
                fragment.style.width = `${size}px`;
                fragment.style.height = `${size * (originalHeight / originalWidth)}px`;

                // Posición inicial (formando el escudo)
                // Usamos valores fijos para simular la forma
                const left = (i % 8) * 12.5;
                const top = Math.floor(i / 8) * 12.5;

                fragment.style.left = `${left}%`;
                fragment.style.top = `${top}%`;
                
                // Guardamos la posición original para la recomposición
                originalPositions.push({
                    left: `${left}%`,
                    top: `${top}%`,
                    transform: 'translate(0, 0) rotate(0deg)'
                });

                shatterField.appendChild(fragment);
                fragments.push(fragment);
            }
        }

        // --- Mecánica de Juego ---
        let isShaking = false;
        let shakeTimeout;
        const shakeThreshold = 2.5; // Ajusta la sensibilidad de agitación

        function handleMotion(event) {
            const acceleration = event.accelerationIncludingGravity;
            const x = acceleration.x;
            const y = acceleration.y;
            const z = acceleration.z;

            // Calcula la fuerza total
            const totalForce = Math.sqrt(x * x + y * y + z * z);

            // Umbral para detectar agitación
            if (totalForce > shakeThreshold * 9.8) {
                if (!isShaking) {
                    shatterShield();
                    isShaking = true;
                    document.getElementById('instructions').innerText = "¡Sigue agitando! ¿Ves la energía?";
                }
                clearTimeout(shakeTimeout);
                shakeTimeout = setTimeout(stopShaking, 300); // 300ms de inactividad para detener
            }
        }

        function shatterShield() {
            fragments.forEach(fragment => {
                // Distancia de dispersión aleatoria
                const scatterDistance = 200; // Máximo movimiento
                const moveX = (Math.random() - 0.5) * scatterDistance;
                const moveY = (Math.random() - 0.5) * scatterDistance;
                // Rotación aleatoria
                const rotate = (Math.random() - 0.5) * 360;

                fragment.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg)`;
                fragment.style.opacity = '0.5'; // Se vuelven más traslúcidos
            });
        }

        function reassembleShield() {
            fragments.forEach((fragment, index) => {
                fragment.style.transform = originalPositions[index].transform;
                fragment.style.opacity = '1';
            });
            document.getElementById('instructions').innerText = "¡Perfecto! Se ha recompuesto.";
        }

        function stopShaking() {
            if (isShaking) {
                reassembleShield();
                isShaking = false;
                document.getElementById('instructions').innerText = "Vuelve a agitar para probar de nuevo.";
            }
        }

        // --- Manejo de Permisos (iOS/Navegadores Modernos) ---
        const permissionBtn = document.getElementById('request-permission-btn');

        function requestPermissions() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            permissionBtn.style.display = 'none'; // Oculta botón
                        }
                    })
                    .catch(console.error);
            } else {
                // Navegadores que no requieren permiso explícito (muchos Android)
                window.addEventListener('devicemotion', handleMotion);
                permissionBtn.style.display = 'none';
            }
        }

        permissionBtn.addEventListener('click', requestPermissions);

        // Verificación inicial de soporte de sensor
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            permissionBtn.style.display = 'block';
            document.getElementById('instructions').innerText = "Toca el botón para habilitar el sensor.";
        } else if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', handleMotion);
        } else {
            document.getElementById('instructions').innerText = "Tu navegador no soporta sensores de movimiento.";
        }

        // --- Inicio ---
        initFragments();
    </script>
</body>
</html>
