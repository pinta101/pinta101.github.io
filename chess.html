<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ajedrez Ultra Fino</title>
    <style>
        :root {
            --bg: #121212;
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --selected: rgba(255, 255, 0, 0.4);
            --accent: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            font-family: system-ui, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }

        #info {
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 94vw;
            height: 94vw;
            max-width: 420px;
            max-height: 420px;
            border: 2px solid #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin: 10px 0;
        }

        .square {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(11vw, 42px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        /* --- ESTILO DE PIEZAS ULTRA FINO --- */

        /* BLANCAS: Sólidas con un borde imperceptible */
        .w { 
            color: #ffffff;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.2);
        }

        /* NEGRAS: Sólidas con reborde blanco ultra fino */
        .b { 
            color: #000000;
            -webkit-text-stroke: 0.8px #ffffff; /* El reborde más fino posible con visibilidad */
            filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.5));
        }

        .selected { background-color: var(--selected) !important; }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 18px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #ddd;
            background-color: transparent;
            border: 1px solid #444;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:active {
            background-color: #333;
            transform: scale(0.95);
        }

        #undoBtn { border-color: #555; }
    </style>
</head>
<body>

    <div id="info">TURNO: BLANCAS</div>
    
    <div id="board"></div>

    <div class="controls">
        <button id="undoBtn">⟲ DESHACER</button>
        <button onclick="location.reload()">REINICIAR</button>
    </div>

    <script>
        const boardDiv = document.getElementById('board');
        const info = document.getElementById('info');
        const undoBtn = document.getElementById('undoBtn');

        const glyphs = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♟', 'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚'
        };

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let history = [];
        let selected = null;
        let turn = 'white';

        function render() {
            boardDiv.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    const p = board[r][c];
                    if(p) {
                        sq.textContent = glyphs[p];
                        sq.classList.add(p === p.toUpperCase() ? 'w' : 'b');
                    }

                    if(selected && selected[0]===r && selected[1]===c) sq.classList.add('selected');
                    
                    sq.onclick = () => handleMove(r, c);
                    boardDiv.appendChild(sq);
                }
            }
            updateUI();
        }

        function handleMove(r, c) {
            const p = board[r][c];
            const isWhite = p && p === p.toUpperCase();

            if(selected) {
                const [sr, sc] = selected;
                if(sr === r && sc === c) {
                    selected = null;
                } else {
                    history.push({ board: board.map(row => [...row]), turn: turn });
                    board[r][c] = board[sr][sc];
                    board[sr][sc] = '';
                    selected = null;
                    turn = turn === 'white' ? 'black' : 'white';
                }
                render();
            } else {
                if(p && ((turn==='white' && isWhite) || (turn==='black' && !isWhite))) {
                    selected = [r, c];
                    render();
                }
            }
        }

        function undo() {
            if(history.length > 0) {
                const lastState = history.pop();
                board = lastState.board;
                turn = lastState.turn;
                selected = null;
                render();
            }
        }

        function updateUI() {
            info.textContent = `TURNO: ${turn === 'white' ? 'BLANCAS' : 'NEGRAS'}`;
            undoBtn.style.opacity = history.length === 0 ? "0.2" : "1";
            undoBtn.style.pointerEvents = history.length === 0 ? "none" : "auto";
        }

        undoBtn.onclick = undo;
        render();
    </script>
</body>
</html>
