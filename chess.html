<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ajedrez · Jaque Mate · 2 jugadores</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1d4a3a, #12342a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }
        .chess-card {
            max-width: 620px;
            width: 100%;
            background: #efe2cc;
            background: linear-gradient(155deg, #f7efdb, #e5d3b5);
            border-radius: 52px 52px 44px 44px;
            box-shadow: 0 28px 38px -12px #082118, inset 0 1px 5px #fff6df;
            padding: 22px 18px 26px 18px;
            border: 1px solid #c7aa7a;
        }
        h1 {
            text-align: center;
            font-weight: 500;
            font-size: clamp(1.8rem, 9vw, 2.5rem);
            letter-spacing: 2px;
            color: #2f2317;
            text-shadow: 3px 3px 0 #dbbd8c, 5px 5px 0 rgba(0,0,0,0.12);
            margin: 0 0 8px 0;
            line-height: 1.1;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #4f4332;
            border-radius: 60px;
            padding: 6px 16px 6px 14px;
            margin-bottom: 20px;
            color: #f5e8ce;
            box-shadow: inset 0 2px 6px #262016, 0 7px 0 #332c1f;
            border-bottom: 2px solid #988d68;
        }
        .turn-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.4rem;
        }
        .turn-badge span {
            background: #685e45;
            padding: 6px 24px;
            border-radius: 50px;
            font-size: 1.3rem;
            box-shadow: inset 0 2px 4px #1f1b10;
        }
        .mini-icons {
            font-size: 2rem;
            filter: drop-shadow(2px 2px 0 #17130b);
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 18px 0 8px 0;
        }
        .btn {
            background: #e3d2ae;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 60px;
            box-shadow: 0 7px 0 #9a865f, 0 10px 14px #0000004d;
            cursor: pointer;
            transition: 0.05s linear;
            color: #282011;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 1 auto;
            border: 1px solid #f7ebcf;
            touch-action: manipulation;
        }
        .btn:active {
            transform: translateY(7px);
            box-shadow: 0 2px 0 #8b784e, 0 6px 12px #00000038;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 5px 0 #8a764e;
            pointer-events: none;
        }
        .board-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            background: #be9b6b;
            padding: 8px;
            border-radius: 36px;
            box-shadow: 0 0 0 6px #a07d53, 0 22px 30px #000000b3;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 1 / 1;
            gap: 3px;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(7vw, 60px);
            background-color: #f0dbb8;
            border-radius: 16px;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25);
            transition: 0.1s ease;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            text-shadow: 3px 5px 7px #1a140c;
            line-height: 1;
        }
        .square.dark {
            background-color: #b27d50;
            box-shadow: inset 0 -4px 7px #4d3822;
        }
        .square.selected {
            background-color: #c5e085;
            box-shadow: 0 0 0 4px #faffb0, inset 0 0 0 4px #2d7135;
            transform: scale(0.96);
        }
        .square.possible-move {
            background-color: #abda7a;
            box-shadow: inset 0 0 0 5px #ffffcc;
        }
        .white-piece {
            color: #f5f0e0;
            text-shadow: 2px 2px 4px #1f1f1f, -1px -1px 0 #333, 1px -1px 0 #222;
        }
        .black-piece {
            color: #262016;
            text-shadow: 2px 2px 6px #dbbc87, 0px 0px 5px #fff2cc;
        }
        .check-indicator {
            background: #c94f4f;
            color: white;
            font-weight: bold;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            box-shadow: inset 0 2px 5px #6d1f1f;
            letter-spacing: 1px;
        }
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: #3f311f;
            font-weight: 500;
            font-size: 1rem;
            padding: 0 8px;
        }
        .captured-box {
            background: #3f3627e8;
            padding: 8px 20px;
            border-radius: 40px;
            color: #f5e3b3;
            font-size: 1.6rem;
            letter-spacing: 6px;
            min-height: 3.4rem;
            border: 1px solid #b6a87b;
            box-shadow: inset 0 2px 6px #1b150b;
            display: flex;
            align-items: center;
        }
        .gameover-message {
            background: #222222;
            color: #facc6f;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.3rem;
            text-transform: uppercase;
            text-align: center;
            box-shadow: inset 0 -3px 0 #4b3d1e;
        }
        @media (max-width: 500px) {
            .chess-card { padding: 16px 10px; }
            .btn { font-size: 1.1rem; padding: 10px 12px; }
            .turn-badge span { font-size: 1rem; padding: 5px 16px; }
            .square { font-size: min(9vw, 55px); }
        }
    </style>
</head>
<body>
    <div class="chess-card">
        <h1>♚ JAQUE MATE ♚</h1>
        <div class="top-bar">
            <div class="turn-badge">
                <span class="mini-icons">♕</span>
                <span id="turnDisplay">Blancas</span>
            </div>
            <div id="checkDisplay" style="background:#584e37; padding:5px 18px; border-radius:40px; font-weight:600;">⚔️</div>
        </div>

        <div class="board-wrapper">
            <div id="boardContainer" class="chess-board"></div>
        </div>

        <div class="controls">
            <button class="btn" id="undoBtn">↩ <span>Deshacer</span></button>
            <button class="btn" id="resetBtn">♻ <span>Reiniciar</span></button>
        </div>

        <div class="footer-info">
            <span style="display: flex; gap:6px;">⚫ capturadas</span>
            <span id="capturedDisplay" class="captured-box">—</span>
        </div>
        <div id="gameOverMsg" class="gameover-message" style="margin-top: 12px; min-height: 3.5rem;"></div>
    </div>

    <script>
        (function() {
            // ----- ESTADO -----
            const initialBoard = [
                ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
                ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
                ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
            ];

            let board = JSON.parse(JSON.stringify(initialBoard));
            let currentTurn = 'white';      // 'white' o 'black'
            let selectedRow = null, selectedCol = null;
            let possibleMoves = [];          // destinos [fila,col]
            let moveHistory = [];             // pila para deshacer
            let gameOver = false;             // true = jaque mate, no se puede mover

            // elementos DOM
            const boardEl = document.getElementById('boardContainer');
            const turnSpan = document.getElementById('turnDisplay');
            const checkSpan = document.getElementById('checkDisplay');
            const capturedSpan = document.getElementById('capturedDisplay');
            const gameOverDiv = document.getElementById('gameOverMsg');

            // ----- FUNCIONES DE UTILIDAD -----
            function pieceColor(piece) {
                if (!piece) return null;
                if ('♙♖♘♗♕♔'.includes(piece)) return 'white';
                if ('♟♜♞♝♛♚'.includes(piece)) return 'black';
                return null;
            }

            // Encontrar posición del rey de un color
            function findKing(color) {
                const kingWhite = '♔';
                const kingBlack = '♚';
                const target = (color === 'white') ? kingWhite : kingBlack;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] === target) return [r, c];
                    }
                }
                return null; // no debería ocurrir, pero si es mate el rey no está (capturado) se considera fin
            }

            // Clonar tablero para simulaciones
            function cloneBoard() {
                return board.map(row => [...row]);
            }

            // ----- VALIDACIÓN DE MOVIMIENTO (sin importar jaque) -----
            function isValidMovePiece(piece, fr, fc, tr, tc, grid) {
                if (!piece) return false;
                const color = pieceColor(piece);
                const target = grid[tr][tc];
                if (target && pieceColor(target) === color) return false;

                const dr = tr - fr;
                const dc = tc - fc;
                const adr = Math.abs(dr);
                const adc = Math.abs(dc);

                // peones
                if (piece === '♙' || piece === '♟') {
                    const dir = (piece === '♙') ? -1 : 1;
                    const startRow = (piece === '♙') ? 6 : 1;
                    if (dc === 0 && dr === dir && !grid[tr][tc]) return true;
                    if (dc === 0 && fr === startRow && dr === 2*dir && !grid[fr+dir][fc] && !grid[tr][tc]) return true;
                    if (adc === 1 && dr === dir && target && pieceColor(target) !== color) return true;
                    return false;
                }
                // torre
                if (piece === '♖' || piece === '♜') {
                    if (fr !== tr && fc !== tc) return false;
                    if (fr === tr) {
                        let step = (tc > fc) ? 1 : -1;
                        for (let c = fc + step; c !== tc; c += step) if (grid[fr][c]) return false;
                    } else {
                        let step = (tr > fr) ? 1 : -1;
                        for (let r = fr + step; r !== tr; r += step) if (grid[r][fc]) return false;
                    }
                    return true;
                }
                // caballo
                if (piece === '♘' || piece === '♞') {
                    return (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
                }
                // alfil
                if (piece === '♗' || piece === '♝') {
                    if (adr !== adc) return false;
                    let rstep = (tr > fr) ? 1 : -1;
                    let cstep = (tc > fc) ? 1 : -1;
                    let r = fr + rstep, c = fc + cstep;
                    while (r !== tr && c !== tc) {
                        if (grid[r][c]) return false;
                        r += rstep;
                        c += cstep;
                    }
                    return true;
                }
                // reina
                if (piece === '♕' || piece === '♛') {
                    if (fr === tr || fc === tc) {
                        if (fr === tr) {
                            let step = (tc > fc) ? 1 : -1;
                            for (let c = fc + step; c !== tc; c += step) if (grid[fr][c]) return false;
                        } else {
                            let step = (tr > fr) ? 1 : -1;
                            for (let r = fr + step; r !== tr; r += step) if (grid[r][fc]) return false;
                        }
                        return true;
                    } else if (adr === adc) {
                        let rstep = (tr > fr) ? 1 : -1;
                        let cstep = (tc > fc) ? 1 : -1;
                        let r = fr + rstep, c = fc + cstep;
                        while (r !== tr && c !== tc) {
                            if (grid[r][c]) return false;
                            r += rstep;
                            c += cstep;
                        }
                        return true;
                    }
                    return false;
                }
                // rey
                if (piece === '♔' || piece === '♚') {
                    return adr <= 1 && adc <= 1;
                }
                return false;
            }

            // ----- DETECCIÓN DE JAQUE (para un color dado en un tablero) -----
            function isInCheck(color, grid) {
                const [kingRow, kingCol] = (color === 'white') ? findKing('white') : findKing('black');
                if (kingRow === null || kingCol === null) return false; // rey no encontrado (pero no debería)
                const opponent = (color === 'white') ? 'black' : 'white';
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const piece = grid[r][c];
                        if (piece && pieceColor(piece) === opponent) {
                            if (isValidMovePiece(piece, r, c, kingRow, kingCol, grid)) {
                                return true; // hay jaque
                            }
                        }
                    }
                }
                return false;
            }

            // ----- SIMULA MOVIMIENTO Y DEVUELVE SI EL REY PROPIO QUEDA EN JAQUE -----
            function moveLeadsToSelfCheck(fr, fc, tr, tc, color) {
                const newBoard = cloneBoard();
                // ejecutar movimiento simulado
                newBoard[tr][tc] = newBoard[fr][fc];
                newBoard[fr][fc] = '';
                // comprobar jaque para 'color' después del movimiento
                return isInCheck(color, newBoard);
            }

            // ----- GENERAR MOVIMIENTOS VÁLIDOS (los que no dejan al rey en jaque) -----
            function getValidMovesForPiece(row, col) {
                const piece = board[row][col];
                if (!piece || pieceColor(piece) !== currentTurn || gameOver) return [];

                const moves = [];
                for (let tr = 0; tr < 8; tr++) {
                    for (let tc = 0; tc < 8; tc++) {
                        if (row === tr && col === tc) continue;
                        // primero ver si la pieza puede moverse ahí (reglas básicas)
                        if (!isValidMovePiece(piece, row, col, tr, tc, board)) continue;

                        // luego verificar que no deje al propio rey en jaque
                        if (!moveLeadsToSelfCheck(row, col, tr, tc, currentTurn)) {
                            moves.push([tr, tc]);
                        }
                    }
                }
                return moves;
            }

            // ----- COMPROBAR SI EL JUGADOR ACTUAL NO TIENE MOVIMIENTOS VÁLIDOS (JAQUE MATE O AHOGADO) -----
            function isCheckmateOrStalemate() {
                // Recorrer todas las piezas del turno actual
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const piece = board[r][c];
                        if (piece && pieceColor(piece) === currentTurn) {
                            const moves = getValidMovesForPiece(r, c);
                            if (moves.length > 0) return false; // al menos un movimiento legal
                        }
                    }
                }
                // si llegamos aquí: no hay movimientos legales
                return true;
            }

            // ----- ACTUALIZAR UI CON INDICADOR DE JAQUE Y MENSAJE DE GAME OVER -----
            function updateStatusMessages() {
                const inCheck = isInCheck(currentTurn, board);
                if (inCheck) {
                    checkSpan.innerHTML = '♔ JAQUE ♔';
                    checkSpan.classList.add('check-indicator');
                } else {
                    checkSpan.innerHTML = '⚔️';
                    checkSpan.classList.remove('check-indicator');
                }

                if (gameOver) {
                    const winner = (currentTurn === 'white') ? '¡NEGRAS GANAN!' : '¡BLANCAS GANAN!';
                    gameOverDiv.innerText = `🏆 ${winner} por mate 🏆`;
                } else {
                    gameOverDiv.innerText = '';
                }
            }

            // render completo
            function render() {
                boardEl.innerHTML = '';
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'square';
                        if ((r + c) % 2 === 1) cell.classList.add('dark');

                        const piece = board[r][c];
                        if (piece) {
                            cell.innerText = piece;
                            if (pieceColor(piece) === 'white') cell.classList.add('white-piece');
                            else cell.classList.add('black-piece');
                        }

                        if (selectedRow === r && selectedCol === c && !gameOver) cell.classList.add('selected');
                        if (!gameOver && possibleMoves.some(([rr, cc]) => rr === r && cc === c)) {
                            cell.classList.add('possible-move');
                        }

                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', handleClick);
                        boardEl.appendChild(cell);
                    }
                }

                // mini capturas (últimas 5)
                let caps = [];
                for (let i = moveHistory.length - 1; i >= 0 && caps.length < 6; i--) {
                    if (moveHistory[i].captured) caps.push(moveHistory[i].captured);
                }
                capturedSpan.innerText = caps.length ? caps.join(' ') : '—';

                updateStatusMessages();
            }

            // función para cambiar turno y verificar mate
            function switchTurnAndCheckMate() {
                currentTurn = (currentTurn === 'white') ? 'black' : 'white';
                if (isCheckmateOrStalemate()) {
                    gameOver = true;
                }
                // limpiar selección
                selectedRow = null; selectedCol = null; possibleMoves = [];
                render();
                turnSpan.innerText = (currentTurn === 'white') ? 'Blancas' : 'Negras';
            }

            // ejecutar movimiento
            function performMove(fr, fc, tr, tc) {
                if (gameOver) return;

                const piece = board[fr][fc];
                const captured = board[tr][tc];

                // Guardar en historial
                moveHistory.push({
                    fromRow: fr, fromCol: fc, toRow: tr, toCol: tc,
                    pieceMoved: piece,
                    captured: captured
                });

                // Aplicar
                board[tr][tc] = piece;
                board[fr][fc] = '';

                // Verificar si después del movimiento el oponente está en mate
                const opponent = (currentTurn === 'white') ? 'black' : 'white';
                // Cambio turno temporal para verificar mate
                const previousTurn = currentTurn;
                currentTurn = opponent;

                if (isCheckmateOrStalemate()) {
                    gameOver = true;
                } else {
                    gameOver = false;
                }

                // Restauramos el turno actual (que es el oponente después del movimiento) realmente ya cambió
                // pero currentTurn ahora es opponent, eso es correcto.
                // solo actualizamos texto
                turnSpan.innerText = (currentTurn === 'white') ? 'Blancas' : 'Negras';

                // limpiar selección
                selectedRow = null; selectedCol = null; possibleMoves = [];
                render();
            }

            // deshacer movimiento
            function undoMove() {
                if (moveHistory.length === 0) return;
                const last = moveHistory.pop();
                board[last.fromRow][last.fromCol] = last.pieceMoved;
                board[last.toRow][last.toCol] = last.captured || '';
                // restablecer turno al que había antes del último movimiento (el color que movió)
                // Podemos deducir: si pieza movida es blanca, entonces turno debería ser blanco? pero más fácil:
                // alternamos currentTurn manualmente
                currentTurn = (pieceColor(last.pieceMoved) === 'white') ? 'white' : 'black';
                gameOver = false;   // al deshacer seguro no hay mate
                selectedRow = null; selectedCol = null; possibleMoves = [];
                render();
                turnSpan.innerText = (currentTurn === 'white') ? 'Blancas' : 'Negras';
            }

            // reiniciar
            function resetGame() {
                board = JSON.parse(JSON.stringify(initialBoard));
                currentTurn = 'white';
                selectedRow = null; selectedCol = null; possibleMoves = [];
                moveHistory = [];
                gameOver = false;
                render();
                turnSpan.innerText = 'Blancas';
            }

            // manejar clics
            function handleClick(e) {
                if (gameOver) return; // no se puede jugar

                const r = parseInt(e.currentTarget.dataset.row);
                const c = parseInt(e.currentTarget.dataset.col);

                // Si hay una pieza seleccionada y el clic es en un movimiento posible
                if (selectedRow !== null && selectedCol !== null) {
                    if (possibleMoves.some(([rr, cc]) => rr === r && cc === c)) {
                        performMove(selectedRow, selectedCol, r, c);
                        return;
                    }
                }

                // Seleccionar pieza si es del turno actual
                const piece = board[r][c];
                if (piece && pieceColor(piece) === currentTurn) {
                    selectedRow = r;
                    selectedCol = c;
                    possibleMoves = getValidMovesForPiece(r, c);
                } else {
                    // deseleccionar
                    selectedRow = null;
                    selectedCol = null;
                    possibleMoves = [];
                }
                render();
            }

            // Botones
            document.getElementById('undoBtn').addEventListener('click', () => {
                if (gameOver) gameOver = false; // si está en mate, permitir deshacer reactiva
                undoMove();
            });
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // Inicializar
            resetGame();
        })();
    </script>
</body>
</html>
