<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ajedrez Uniforme Mobile</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 255, 0, 0.5);
            /* Colores de las piezas para que sean uniformes */
            --p-white: #ffffff;
            --p-black: #000000;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            touch-action: manipulation;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 95vw;
            height: 95vw;
            max-width: 450px;
            max-height: 450px;
            border: 2px solid #333;
            user-select: none;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            /* TRUCO CLAVE: Forzamos la variante de texto para evitar Emojis */
            font-family: "Courier New", Courier, monospace;
            font-size: min(10vw, 45px);
            cursor: pointer;
            position: relative;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        /* Estilo uniforme para piezas Blancas */
        .w { 
            color: var(--p-white); 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8), 0 0 1px rgba(0,0,0,0.5);
        }

        /* Estilo uniforme para piezas Negras */
        .b { 
            color: var(--p-black); 
            text-shadow: 0 0 2px rgba(255,255,255,0.4);
        }

        .selected { background-color: var(--highlight) !important; }

        #info {
            color: white;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="info">Turno: Blancas</div>
    <div id="board"></div>

    <script>
        const boardDiv = document.getElementById('board');
        const info = document.getElementById('info');

        // Usamos solo la variante sólida para ambas para garantizar simetría
        const unicodePieces = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚', 'P': '♟'
        };

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let selected = null;
        let turn = 'white';

        function draw() {
            boardDiv.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    const char = board[r][c];
                    if(char) {
                        sq.textContent = unicodePieces[char];
                        // Asignamos clase 'w' si es mayúscula, 'b' si es minúscula
                        sq.classList.add(char === char.toUpperCase() ? 'w' : 'b');
                    }

                    if(selected && selected[0]===r && selected[1]===c) sq.classList.add('selected');
                    
                    sq.onclick = () => click(r, c);
                    boardDiv.appendChild(sq);
                }
            }
        }

        function click(r, c) {
            const piece = board[r][c];
            const isWhite = piece && piece === piece.toUpperCase();

            if(selected) {
                const [sr, sc] = selected;
                if(sr === r && sc === c) {
                    selected = null;
                } else {
                    board[r][c] = board[sr][sc];
                    board[sr][sc] = '';
                    selected = null;
                    turn = turn === 'white' ? 'black' : 'white';
                    info.textContent = `Turno: ${turn === 'white' ? 'Blancas' : 'Negras'}`;
                }
            } else {
                if(piece && ((turn==='white' && isWhite) || (turn==='black' && !isWhite))) {
                    selected = [r, c];
                }
            }
            draw();
        }

        draw();
    </script>
</body>
</html>
