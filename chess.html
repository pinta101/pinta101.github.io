<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ajedrez Mobile Minimal</title>
    <style>
        :root {
            --bg: #161618;
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --selected: rgba(255, 255, 0, 0.5);
            --accent: #4a6fa5;
            /* Colores de piezas forzados */
            --p-white: #ffffff;
            --p-black: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Centrado vertical robusto */
            justify-content: center; 
            height: 100vh;
            /* Soporte para "notches" y barras de estado modernas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            color: white;
            overflow: hidden; /* Evita scrolls raros */
        }

        #info {
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            /* Tamaño responsive pero con límites */
            width: 94vw;
            height: 94vw;
            max-width: 420px;
            max-height: 420px;
            border: 3px solid #444;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            /* Asegura que no se pegue arriba ni abajo */
            margin: auto 0; 
        }

        .square {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Tamaño de pieza adaptable */
            font-size: min(11vw, 40px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            /* Forzamos que sea texto, no emoji */
            font-variant-ligatures: none;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        /* NUEVAS PIEZAS DE CONTORNO: Reaccionan 100% al color CSS */
        
        /* Piezas Blancas: Blanco Puro con contorno negro sutil para contraste */
        .w { 
            color: var(--p-white) !important;
            fill: var(--p-white) !important;
            /* Contorno sutil para que se vea en casillas claras */
            -webkit-text-stroke: 1px rgba(0,0,0,0.6);
            text-shadow: 0 0 1px rgba(0,0,0,0.3);
        }

        /* Piezas Negras: Negro Puro con contorno blanco sutil para contraste */
        .b { 
            color: var(--p-black) !important;
            fill: var(--p-black) !important;
            /* Contorno sutil para que se vea en casillas oscuras */
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
        }

        .selected { background-color: var(--selected) !important; }

        .controls {
            margin: 15px 0 env(safe-area-inset-bottom);
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 3px #2a4163;
        }

        button:active {
            box-shadow: 0 1px #2a4163;
            transform: translateY(2px);
        }

        button.secondary {
            background-color: #444;
            box-shadow: 0 3px #222;
        }
    </style>
</head>
<body>

    <div id="info">TURNO: BLANCAS</div>
    
    <div id="board"></div>

    <div class="controls">
        <button id="undoBtn" class="secondary">⟲ Deshacer</button>
        <button onclick="location.reload()">Reiniciar</button>
    </div>

    <script>
        const boardDiv = document.getElementById('board');
        const info = document.getElementById('info');
        const undoBtn = document.getElementById('undoBtn');

        // USAMOS PIEZAS UNICODE DE CONTORNO (LINEALES)
        // Son mucho más compatibles y sencillas para móvil
        const glyphs = {
            'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let history = [];
        let selected = null;
        let turn = 'white';

        function render() {
            boardDiv.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    const p = board[r][c];
                    if(p) {
                        sq.textContent = glyphs[p];
                        // Asignamos clase w (mayúscula) o b (minúscula)
                        sq.classList.add(p === p.toUpperCase() ? 'w' : 'b');
                    }

                    if(selected && selected[0]===r && selected[1]===c) {
                        sq.classList.add('selected');
                    }

                    sq.onclick = () => handleMove(r, c);
                    boardDiv.appendChild(sq);
                }
            }
            updateUI();
        }

        function handleMove(r, c) {
            const p = board[r][c];
            const isWhite = p && p === p.toUpperCase();

            if(selected) {
                const [sr, sc] = selected;
                if(sr === r && sc === c) {
                    selected = null;
                } else {
                    // GUARDAR HISTORIAL
                    history.push({
                        board: board.map(row => [...row]),
                        turn: turn
                    });

                    // Mover
                    board[r][c] = board[sr][sc];
                    board[sr][sc] = '';
                    selected = null;
                    turn = turn === 'white' ? 'black' : 'white';
                }
                render();
            } else {
                if(p && ((turn==='white' && isWhite) || (turn==='black' && !isWhite))) {
                    selected = [r, c];
                    render();
                }
            }
        }

        function undo() {
            if(history.length > 0) {
                const lastState = history.pop();
                board = lastState.board;
                turn = lastState.turn;
                selected = null;
                render();
            }
        }

        function updateUI() {
            info.textContent = `TURNO: ${turn === 'white' ? 'BLANCAS' : 'NEGRAS'}`;
            info.style.color = turn === 'white' ? '#fff' : '#aaa';
            
            // Estado del botón deshacer
            if(history.length === 0) {
                undoBtn.style.opacity = "0.4";
                undoBtn.style.pointerEvents = "none";
            } else {
                undoBtn.style.opacity = "1";
                undoBtn.style.pointerEvents = "auto";
            }
        }

        undoBtn.onclick = undo;
        render();
    </script>
</body>
</html>
