<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ajedrez Pro con Deshacer</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --light-sq: #ebecd0;
            --dark-sq: #779556;
            --selected: rgba(255, 255, 0, 0.6);
            --accent: #3d5a80;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            color: white;
        }

        #info {
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 92vw;
            height: 92vw;
            max-width: 450px;
            max-height: 450px;
            border: 4px solid #333;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .square {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(10vw, 42px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        /* Piezas Uniformes */
        .w { color: #fff; text-shadow: 0 0 2px #000, 1px 1px 3px rgba(0,0,0,0.4); }
        .b { color: #000; text-shadow: 0 0 1px #fff; }

        .selected { background-color: var(--selected) !important; }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px #293241;
            transition: all 0.1s;
        }

        button:active {
            box-shadow: 0 0 transparent;
            transform: translateY(4px);
        }

        button.secondary {
            background-color: #555;
            box-shadow: 0 4px #333;
        }
    </style>
</head>
<body>

    <div id="info">TURNO: BLANCAS</div>
    
    <div id="board"></div>

    <div class="controls">
        <button id="undoBtn" class="secondary">⟲ Deshacer</button>
        <button onclick="location.reload()">Reiniciar</button>
    </div>

    <script>
        const boardDiv = document.getElementById('board');
        const info = document.getElementById('info');
        const undoBtn = document.getElementById('undoBtn');

        const glyphs = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♟', 'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚'
        };

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let history = []; // Aquí guardaremos los estados anteriores
        let selected = null;
        let turn = 'white';

        function render() {
            boardDiv.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    const p = board[r][c];
                    if(p) {
                        sq.textContent = glyphs[p];
                        sq.classList.add(p === p.toUpperCase() ? 'w' : 'b');
                    }

                    if(selected && selected[0]===r && selected[1]===c) {
                        sq.classList.add('selected');
                    }

                    sq.onclick = () => handleMove(r, c);
                    boardDiv.appendChild(sq);
                }
            }
            updateUI();
        }

        function handleMove(r, c) {
            const p = board[r][c];
            const isWhite = p && p === p.toUpperCase();

            if(selected) {
                const [sr, sc] = selected;
                if(sr === r && sc === c) {
                    selected = null;
                } else {
                    // GUARDAR HISTORIAL antes de mover
                    // Hacemos una copia profunda del tablero
                    history.push({
                        board: board.map(row => [...row]),
                        turn: turn
                    });

                    // Ejecutar movimiento
                    board[r][c] = board[sr][sc];
                    board[sr][sc] = '';
                    selected = null;
                    turn = turn === 'white' ? 'black' : 'white';
                }
                render();
            } else {
                if(p && ((turn==='white' && isWhite) || (turn==='black' && !isWhite))) {
                    selected = [r, c];
                    render();
                }
            }
        }

        function undo() {
            if(history.length > 0) {
                const lastState = history.pop();
                board = lastState.board;
                turn = lastState.turn;
                selected = null;
                render();
            }
        }

        function updateUI() {
            info.textContent = `TURNO: ${turn === 'white' ? 'BLANCAS' : 'NEGRAS'}`;
            info.style.color = turn === 'white' ? '#fff' : '#888';
            undoBtn.style.opacity = history.length === 0 ? "0.5" : "1";
            undoBtn.style.pointerEvents = history.length === 0 ? "none" : "auto";
        }

        undoBtn.onclick = undo;
        render();
    </script>
</body>
</html>
