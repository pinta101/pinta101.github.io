<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELADA AELIP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body { overflow: hidden; background: #08080f; height: 100%; }

  #scene {
    width: 100%;
    height: 100dvh;
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: #08080f;
    position: relative;
    overflow: hidden;
  }

  /* Partículas de fondo (estrellas/polvo) */
  #bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  /* Botón */
  #btn-zone {
    height: 20%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    flex-direction: column;
    gap: 10px;
  }
  #toggle-btn {
    width: 50%;
    max-width: 260px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    box-shadow: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.3s, border-color 0.3s, color 0.3s, transform 0.1s;
  }
  #toggle-btn:active { transform: scale(0.97); }
  #toggle-btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.55);
    color: rgba(255,255,255,0.95);
  }
  #toggle-btn.off {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.75);
  }

  /* Zona llama */
  #flame-zone {
    height: 60%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 5;
  }

  /* Zona vela */
  #candle-zone {
    height: 20%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 6;
  }

  .candle-body {
    width: 220px;
    height: 100%;
    background: linear-gradient(to right,
      #c8bfb0 0%, #e8e0d0 10%, #f8f4ee 30%,
      #ffffff 50%, #f0ece4 70%, #ddd6c8 90%, #c0b8aa 100%
    );
    border-radius: 12px 12px 6px 6px;
    position: relative;
    box-shadow: 6px 0 24px #00000066, -6px 0 16px #00000044, inset 2px 0 8px #ffffff44;
    cursor: pointer;
  }

  /* Mecha */
  .wick {
    width: 5px;
    height: 32px;
    background: #3a2a10;
    border-radius: 3px;
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
  }
  .wick::after {
    content: "";
    width: 8px; height: 8px;
    background: #ff6a00;
    border-radius: 50%;
    position: absolute;
    top: -5px; left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.4s;
    box-shadow: 0 0 6px #ff6a00;
  }
  .wick.lit::after { opacity: 1; }

  /* Contenedor llama */
  #flame-wrap {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }

  /* SVG llama */
  .flame-svg {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 175px; height: 95%;
    opacity: 0;
    transition: opacity 0.7s;
    filter: blur(0.6px);
    transform-origin: bottom center;
  }
  .flame-svg.visible { opacity: 1; }

  /* Animación de encendido dramático */
  @keyframes ignite {
    0%   { transform: translateX(-50%) scaleX(0.1) scaleY(0.05); opacity: 0; filter: blur(4px); }
    20%  { transform: translateX(-50%) scaleX(1.8) scaleY(0.3); opacity: 0.9; filter: blur(2px); }
    40%  { transform: translateX(-50%) scaleX(0.6) scaleY(1.4); opacity: 1; filter: blur(1px); }
    60%  { transform: translateX(-50%) scaleX(1.3) scaleY(0.9); opacity: 1; filter: blur(0.8px); }
    80%  { transform: translateX(-50%) scaleX(0.9) scaleY(1.1); opacity: 1; filter: blur(0.7px); }
    100% { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 1; filter: blur(0.6px); }
  }
  .flame-svg.igniting {
    animation: ignite 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  /* Destello de encendido */
  #ignite-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 65%, #ffcc0099 0%, #ff660044 40%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    z-index: 20;
    transition: opacity 0.1s;
  }
  #ignite-flash.burst {
    animation: flashBurst 0.8s ease-out forwards;
  }
  @keyframes flashBurst {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Resplandor */
  #glow {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(ellipse at 50% 75%, #ffb300aa 0%, #ff6a0044 45%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.7s;
    border-radius: 50%;
    z-index: 4;
  }
  #glow.visible { opacity: 1; }

  /* Humo */
  #smoke-wrap {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    pointer-events: none;
    z-index: 8;
    overflow: visible;
  }
  @keyframes smokeRise {
    0%   { transform: translate(-50%, 0) scale(0.4); opacity: 0.6; }
    50%  { opacity: 0.3; }
    100% { transform: translate(calc(-50% + var(--dx)), -300px) scale(5); opacity: 0; }
  }

  /* Chispas */
  #sparks-wrap {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    pointer-events: none;
    z-index: 9;
    overflow: visible;
  }
  @keyframes sparkFly {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--sx), var(--sy)) scale(0);
      opacity: 0;
    }
  }

  /* Goteos de cera animados */
  .candle-drip {
    position: absolute;
    top: 0;
    background: linear-gradient(to bottom, #f0ece0, #ddd6c8cc);
    border-radius: 0 0 12px 12px;
    opacity: 0.8;
    transition: height 2s ease-in-out;
  }
  .candle-drip.dripping {
    animation: dripFlow var(--drip-dur, 6s) ease-in-out infinite alternate;
  }
  @keyframes dripFlow {
    0%   { height: var(--drip-min, 20px); }
    100% { height: var(--drip-max, 48px); }
  }
  /* Gota colgante */
  .candle-drip::after {
    content: "";
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 10px;
    background: #ddd6c8cc;
    border-radius: 0 0 50% 50%;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .candle-drip.dripping::after { opacity: 1; }

  /* Luz ambiental */
  #ambient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 80%, #ff880018 0%, transparent 60%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
    z-index: 2;
  }
  #ambient.visible { opacity: 1; }

  /* Viento — inclinación de llama al mover ratón */
  /* controlado desde JS */
</style>
</head>

  <canvas id="bg-particles"></canvas>

  </div>

<script>
// ─── Estado ────────────────────────────────────────────────────────────────
let isLit        = false;
let flickerRaf;
let smokeTimeout, smokeInterval;
let sparkInterval;
let flameFactor  = 1;
let targetFactor = 1;

// Mouse/touch drag
let dragging      = false;
let dragStartY    = 0;
let dragStartFactor = 1;

// Viento por ratón
let mouseWindX = 0;  // -1..1

// Audio (Web Audio API synth — sonido de vela multicapa)
let audioCtx, crackleStarted = false;
let masterGain;
// Capas de audio
let baseHissGain;      // siseo base de la llama
let crackleSchedTimer; // scheduler de chasquidos
let crackleGain;       // alias para compatibilidad con setCrackleVolume
let deepRumbleGain;    // rumble grave de la llama
let sparkPopGain;      // chispazo agudo ocasional

// Refs DOM
const flame1      = document.getElementById("flame1");
const glow        = document.getElementById("glow");
const ambient     = document.getElementById("ambient");
const wick        = document.getElementById("main-wick");
const btn         = document.getElementById("toggle-btn");
const smokeWrap   = document.getElementById("smoke-wrap");
const sparksWrap  = document.getElementById("sparks-wrap");
const scene       = document.getElementById("scene");
const igFlash     = document.getElementById("ignite-flash");
const bgCanvas    = document.getElementById("bg-particles");

// ─── Partículas de fondo (polvo de luz) ───────────────────────────────────
(function initBgParticles() {
  const ctx = bgCanvas.getContext("2d");
  let W, H, particles = [];

  function resize() {
    W = bgCanvas.width  = window.innerWidth;
    H = bgCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * 1, y: Math.random(),
      r: 0.5 + Math.random() * 1.2,
      speed: 0.00008 + Math.random() * 0.0002,
      opacity: 0.05 + Math.random() * 0.18,
      drift: (Math.random() - 0.5) * 0.0003
    });
  }

  function drawBg() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,140,${p.opacity * (isLit ? 1 : 0.3)})`;
      ctx.fill();
      p.y -= p.speed;
      p.x += p.drift;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      if (p.x < -0.02) p.x = 1.02;
      if (p.x > 1.02)  p.x = -0.02;
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();
})();

// ─── Audio multicapa de vela ──────────────────────────────────────────────
// Utilidad: buffer de ruido coloreado
function makeNoiseBuffer(ctx, seconds, color) {
  const len  = ctx.sampleRate * seconds;
  const buf  = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  // color: 0 = blanco, 1 = rosa (integrado), 2 = marrón
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (color === 1) { // pink noise
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
      b6=w*0.115926;
    } else if (color === 2) { // brown noise
      b0 = (b0 + 0.02*w) / 1.02; data[i] = b0 * 3.5;
    } else {
      data[i] = w;
    }
  }
  return buf;
}

function initCrackle() {
  if (crackleStarted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

    // Master muy bajo — sonido de fondo discreto
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    // ── Capa de aire: ruido marrón muy suave, casi inaudible ──────────────
    // Da la sensación de "presencia" cálida sin destacar
    const airNode = audioCtx.createBufferSource();
    airNode.buffer = makeNoiseBuffer(audioCtx, 5, 2); // ruido marrón
    airNode.loop = true;

    const airLP = audioCtx.createBiquadFilter();
    airLP.type = "lowpass";
    airLP.frequency.value = 320; // solo graves muy suaves

    baseHissGain = audioCtx.createGain();
    baseHissGain.gain.value = 0.18; // muy sutil

    airNode.connect(airLP);
    airLP.connect(baseHissGain);
    baseHissGain.connect(masterGain);
    airNode.start();

    // ── Modulación lentísima (respiración de la llama) ────────────────────
    const lfo1 = audioCtx.createOscillator();
    lfo1.frequency.value = 0.8; // muy lento
    lfo1.type = "sine";
    const lfoGain1 = audioCtx.createGain();
    lfoGain1.gain.value = 0.04; // modulación mínima
    lfo1.connect(lfoGain1);
    lfoGain1.connect(masterGain.gain);
    lfo1.start();

    // ── Chasquidos de madera: esporádicos, cortos y muy suaves ───────────
    sparkPopGain = audioCtx.createGain();
    sparkPopGain.gain.value = 1.0;
    sparkPopGain.connect(masterGain);

    crackleGain = masterGain; // alias
    crackleStarted = true;
    schedulePops();
  } catch(e) { /* audio no disponible */ }
}

// Chasquidos: pocos, suaves, bien espaciados — madera quemándose despacio
function schedulePops() {
  if (!crackleStarted || !sparkPopGain) return;
  const now = audioCtx.currentTime;

  // La mayoría de las veces solo 1 chasquido pequeño, rara vez 2
  const count = Math.random() < 0.2 ? 2 : 1;

  for (let i = 0; i < count; i++) {
    const delay  = i * (0.08 + Math.random() * 0.25); // pequeño offset si son 2
    // Frecuencia alta de madera seca: 900–2200 Hz (chasquido, no "pop")
    const freq   = 900 + Math.random() * 1300;
    // Decaimiento muy rápido — solo un "tick"
    const decay  = 40 + Math.random() * 60;
    // Volumen muy bajo
    const vol    = 0.018 + Math.random() * 0.028;

    const bLen  = Math.ceil(audioCtx.sampleRate * 0.06);
    const buf   = audioCtx.createBuffer(1, bLen, audioCtx.sampleRate);
    const d     = buf.getChannelData(0);
    for (let j = 0; j < bLen; j++) {
      const t = j / audioCtx.sampleRate;
      d[j] = (Math.random() * 2 - 1) * Math.exp(-t * decay);
    }

    const src  = audioCtx.createBufferSource();
    src.buffer = buf;

    // Filtro paso banda estrecho — timbre de madera seca
    const filt = audioCtx.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.value = freq;
    filt.Q.value = 4 + Math.random() * 4; // bastante estrecho

    const g = audioCtx.createGain();
    g.gain.value = vol;

    src.connect(filt);
    filt.connect(g);
    g.connect(sparkPopGain);
    src.start(now + delay);
  }

  // Intervalo largo y variable: 800–2500 ms entre chasquidos
  // Parece madera real, no un loop mecánico
  const nextIn = 800 + Math.random() * 1700;
  crackleSchedTimer = setTimeout(() => {
    if (crackleStarted) schedulePops();
  }, nextIn);
}

function setCrackleVolume(vol) {
  if (!masterGain) return;
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.setTargetAtTime(Math.max(0, vol), t, vol > 0 ? 1.2 : 0.6);
}

function stopAudio() {
  clearTimeout(crackleSchedTimer);
  crackleStarted = false;
  if (masterGain) {
    const t = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setValueAtTime(masterGain.gain.value, t);
    masterGain.gain.linearRampToValueAtTime(0, t + 0.3);
  }
  setTimeout(() => {
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
      masterGain = null;
      sparkPopGain = null;
      crackleGain = null;
    }
  }, 350);
}

// ─── Flicker principal ─────────────────────────────────────────────────────
function flicker() {
  if (!isLit) return;
  const t   = Date.now() / 1000;
  const n1  = Math.sin(t * 7.3)  * 0.09;
  const n2  = Math.sin(t * 13.1) * 0.04;
  const n3  = Math.sin(t * 3.7)  * 0.07;
  const noise = n1 + n2 + n3;

  if (!dragging) {
    // Recovery suave
    targetFactor += (1 - targetFactor) * 0.003;
    targetFactor = Math.min(2.5, Math.max(0.2, targetFactor));
  }

  flameFactor += (targetFactor - flameFactor) * 0.08;

  // Viento por ratón — inclina y deforma
  const windSkew = mouseWindX * 12 * flameFactor;
  const windTx   = mouseWindX * 18 * flameFactor;

  const scaleX = flameFactor * (1 + noise * 0.45 + Math.abs(mouseWindX) * 0.3);
  const scaleY = flameFactor * (1 + noise * 0.30 - Math.abs(mouseWindX) * 0.15);
  const skewX  = Math.sin(t * 5.1) * 3 + windSkew;
  const tx     = Math.sin(t * 4.3) * 4 + windTx;

  flame1.style.transform =
    `translateX(calc(-50% + ${tx}px)) scaleX(${scaleX}) scaleY(${scaleY}) skewX(${skewX}deg)`;

  const gs = (460 + noise * 100) * Math.min(flameFactor, 1.8);
  glow.style.width  = gs + "px";
  glow.style.height = gs + "px";
  ambient.style.opacity = isLit ? Math.min(flameFactor * 0.7, 1) : 0;

  flickerRaf = requestAnimationFrame(flicker);
}

// ─── Chispas ───────────────────────────────────────────────────────────────
function spawnSpark() {
  if (!isLit) return;
  const count = Math.random() < 0.3 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const p   = document.createElement("div");
    const ang = (Math.random() * 160 - 130) * (Math.PI / 180); // hacia arriba
    const dist = 40 + Math.random() * 120;
    const sx  = Math.cos(ang) * dist;
    const sy  = -Math.abs(Math.sin(ang)) * dist - 30;
    const sz  = 2 + Math.random() * 3;
    const dur = 0.5 + Math.random() * 0.8;
    const col = Math.random() < 0.3 ? "#fff8c0" : (isBlue ? "#88ddff" : "#ffaa22");
    p.style.cssText = `
      position: absolute;
      bottom: 0; left: 0;
      width: ${sz}px; height: ${sz}px;
      border-radius: 50%;
      background: ${col};
      box-shadow: 0 0 ${sz * 2}px ${col};
      --sx: ${sx}px; --sy: ${sy}px;
      animation: sparkFly ${dur}s ease-out forwards;
    `;
    sparksWrap.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000 + 100);
  }
}

function startSparks() {
  clearInterval(sparkInterval);
  sparkInterval = setInterval(() => {
    if (isLit && flameFactor > 0.4) spawnSpark();
  }, 180 + Math.random() * 200);
}
function stopSparks() { clearInterval(sparkInterval); }

// ─── Humo ──────────────────────────────────────────────────────────────────
function spawnSmoke() {
  const p   = document.createElement("div");
  const dx  = (Math.random() - 0.5) * 90;
  const sz  = 16 + Math.random() * 20;
  const dur = 1.8 + Math.random() * 1.4;
  p.style.cssText = `
    position:absolute; bottom:0; left:0;
    width:${sz}px; height:${sz}px;
    border-radius:50%;
    background:#bbb9;
    opacity:0;
    --dx:${dx}px;
    animation:smokeRise ${dur}s ease-out forwards;
  `;
  smokeWrap.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000 + 200);
}

function startSmoke() {
  smokeInterval = setInterval(spawnSmoke, 140);
  smokeTimeout  = setTimeout(() => clearInterval(smokeInterval), 3000);
}

// ─── Goteos animados ───────────────────────────────────────────────────────
function activateDrips() {
  document.querySelectorAll(".candle-drip").forEach(d => {
    const mn  = parseFloat(d.dataset.min  || 16);
    const mx  = parseFloat(d.dataset.max  || 40);
    const dur = parseFloat(d.dataset.dur  || 6);
    d.style.setProperty("--drip-min", mn + "px");
    d.style.setProperty("--drip-max", mx + "px");
    d.style.setProperty("--drip-dur", dur + "s");
    d.style.height = mn + "px";
    // Offset aleatorio para que no vayan todas sincronizadas
    d.style.animationDelay = (Math.random() * -dur) + "s";
    d.classList.add("dripping");
  });
}
function deactivateDrips() {
  document.querySelectorAll(".candle-drip").forEach(d => {
    d.classList.remove("dripping");
  });
}

// ─── Viento por ratón ──────────────────────────────────────────────────────
scene.addEventListener("mousemove", e => {
  if (!isLit) return;
  const cx = window.innerWidth / 2;
  // -1 (izq) a +1 (der), más intenso cerca de los bordes
  mouseWindX = ((e.clientX - cx) / cx) * 0.6;
});
scene.addEventListener("mouseleave", () => { mouseWindX = 0; });

// Touch wind
scene.addEventListener("touchmove", e => {
  if (!isLit) return;
  const t  = e.touches[0];
  const cx = window.innerWidth / 2;
  mouseWindX = ((t.clientX - cx) / cx) * 0.5;
}, { passive: true });

// ─── Drag lateral (tamaño llama) ───────────────────────────────────────────
function isLateral(clientX) {
  const w = window.innerWidth;
  return clientX < w * 0.25 || clientX > w * 0.75;
}
function onDragStart(clientX, clientY) {
  if (!isLit || !isLateral(clientX)) return;
  dragging = true;
  dragStartY = clientY;
  dragStartFactor = targetFactor;
}
function onDragMove(clientX, clientY) {
  if (!dragging || !isLit) return;
  const dy = dragStartY - clientY;
  targetFactor = Math.min(2.5, Math.max(0.2, dragStartFactor + (dy / window.innerHeight) * 3));
}
function onDragEnd() { dragging = false; }

scene.addEventListener("touchstart", e => {
  const t = e.touches[0];
  onDragStart(t.clientX, t.clientY);
}, { passive: true });
scene.addEventListener("touchmove", e => {
  const t = e.touches[0];
  onDragMove(t.clientX, t.clientY);
}, { passive: true });
scene.addEventListener("touchend", onDragEnd);
scene.addEventListener("mousedown",  e => onDragStart(e.clientX, e.clientY));
scene.addEventListener("mousemove",  e => { if (dragging) onDragMove(e.clientX, e.clientY); });
scene.addEventListener("mouseup",    onDragEnd);
scene.addEventListener("mouseleave", onDragEnd);

// ─── Toggle encender/apagar ────────────────────────────────────────────────
function toggleCandle() {
  if (!isLit) {
    // ENCENDER
    isLit        = true;
    flameFactor  = 0;
    targetFactor = 1;

    // Animación dramática de encendido
    flame1.classList.remove("visible", "igniting");
    void flame1.offsetWidth; // reflow
    flame1.classList.add("visible", "igniting");
    flame1.addEventListener("animationend", () => {
      flame1.classList.remove("igniting");
    }, { once: true });

    // Flash de destello
    igFlash.classList.remove("burst");
    void igFlash.offsetWidth;
    igFlash.classList.add("burst");

    glow.classList.add("visible");
    ambient.classList.add("visible");
    wick.classList.add("lit");
    btn.textContent = "Apagar";
    btn.classList.remove("off");

    // Sonido
    initCrackle();
    setTimeout(() => setCrackleVolume(0.18), 100);

    // Chispas de encendido
    for (let i = 0; i < 8; i++) setTimeout(spawnSpark, i * 60);
    startSparks();
    activateDrips();
    flicker();

  } else {
    // APAGAR
    isLit = false;
    cancelAnimationFrame(flickerRaf);
    flame1.classList.remove("visible");
    glow.classList.remove("visible");
    ambient.classList.remove("visible");
    wick.classList.remove("lit");
    flame1.style.transform = "translateX(-50%)";
    btn.textContent = "Encender";
    btn.classList.add("off");

    stopAudio();
    stopSparks();
    deactivateDrips();    mouseWindX = 0;
    clearTimeout(smokeTimeout);
    clearInterval(smokeInterval);
    startSmoke();
  }
}

// ─── Cambio color azul ─────────────────────────────────────────────────────
let isBlue = false;
function toggleBlue() {
  if (!isLit) return;
  isBlue = !isBlue;
  const body   = document.querySelector(".candle-body");
  const wickEl = document.getElementById("main-wick");

  if (isBlue) {
    body.style.background  = "linear-gradient(to right,#7ec8e3 0%,#b0dff0 20%,#d0eefc 45%,#e8f7ff 60%,#c0e8f8 80%,#90cce0 100%)";
    body.style.boxShadow   = "6px 0 24px #0088cc44,-6px 0 16px #0066aa33,inset 2px 0 8px #ffffff55";
    document.querySelectorAll(".flame-svg path,.flame-svg ellipse").forEach(el => {
      const f = el.getAttribute("fill");
      if (f === "url(#fg1)") el.setAttribute("fill","url(#bg1)");
      else if (f === "url(#fg2)") el.setAttribute("fill","url(#bg2)");
      else if (f === "url(#fg3)") el.setAttribute("fill","url(#bg3)");
      else if (f === "#ff5500") el.setAttribute("fill","#0088cc");
      else if (f === "#fffef0") el.setAttribute("fill","#d0f0ff");
    });
    glow.style.background    = "radial-gradient(ellipse at 50% 75%,#44aaff88 0%,#0066ff33 45%,transparent 70%)";
    ambient.style.background = "radial-gradient(ellipse at 50% 80%,#0088ff18 0%,transparent 60%)";
    wickEl.style.background  = "#1a3a5a";
  } else {
    body.style.background  = "";
    body.style.boxShadow   = "";
    document.querySelectorAll(".flame-svg path,.flame-svg ellipse").forEach(el => {
      const f = el.getAttribute("fill");
      if (f === "url(#bg1)") el.setAttribute("fill","url(#fg1)");
      else if (f === "url(#bg2)") el.setAttribute("fill","url(#fg2)");
      else if (f === "url(#bg3)") el.setAttribute("fill","url(#fg3)");
      else if (f === "#0088cc") el.setAttribute("fill","#ff5500");
      else if (f === "#d0f0ff") el.setAttribute("fill","#fffef0");
    });
    glow.style.background    = "radial-gradient(ellipse at 50% 75%,#ffb300aa 0%,#ff6a0044 45%,transparent 70%)";
    ambient.style.background = "radial-gradient(ellipse at 50% 80%,#ff880018 0%,transparent 60%)";
    wickEl.style.background  = "";
  }
}
</script>
