<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela Animada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a12; }
  #scene {
    width: 100%;
    height: 100vh;
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: #0a0a12;
    position: relative;
    overflow: hidden;
  }

  /* 20% superior: botón */
  #btn-zone {
    height: 20%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #toggle-btn {
    width: 50%;
    max-width: 260px;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, #c8860a, #e8b44a);
    color: #fff;
    box-shadow: 0 4px 30px #e8b44a55;
    transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
  }
  #toggle-btn:active { transform: scale(0.97); }
  #toggle-btn.off {
    background: linear-gradient(135deg, #2a2a2a, #555);
    box-shadow: 0 4px 18px #00000088;
  }

  /* 45% central: llama */
  #flame-zone {
    height: 60%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 5;
  }

  /* 35% inferior: cuerpo de la vela */
  #candle-zone {
    height: 20%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 6;
  }

  /* VELA ANCHA: 220px */
  .candle-body {
    width: 220px;
    height: 100%;
    background: linear-gradient(to right,
      #c8bfb0 0%,
      #e8e0d0 10%,
      #f8f4ee 30%,
      #ffffff 50%,
      #f0ece4 70%,
      #ddd6c8 90%,
      #c0b8aa 100%
    );
    border-radius: 12px 12px 6px 6px;
    position: relative;
    box-shadow: 6px 0 24px #00000066, -6px 0 16px #00000044, inset 2px 0 8px #ffffff44;
  }

  /* Mecha */
  .wick {
    width: 5px;
    height: 32px;
    background: #3a2a10;
    border-radius: 3px;
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
  }
  .wick::after {
    content: '';
    width: 8px;
    height: 8px;
    background: #ff6a00;
    border-radius: 50%;
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.4s;
    box-shadow: 0 0 6px #ff6a00;
  }
  .wick.lit::after { opacity: 1; }

  /* Contenedor llama — ocupa todo el zone */
  #flame-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }

  /* SVG llama — 2.5x más grande que original (70x200) = 175x500 pero ajustado al 50% de pantalla */
  .flame-svg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 175px;
    height: 95%;
    opacity: 0;
    transition: opacity 0.7s;
    filter: blur(0.6px);
    transform-origin: bottom center;
  }
  .flame-svg.visible { opacity: 1; }

  /* Resplandor */
  #glow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse at 50% 75%, #ffb300aa 0%, #ff6a0044 45%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.7s;
    border-radius: 50%;
    z-index: 4;
  }
  #glow.visible { opacity: 1; }

  /* Humo */
  #smoke-wrap {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 8;
    overflow: visible;
  }
  @keyframes smokeRise {
    0%   { transform: translate(-50%, 0) scale(0.4); opacity: 0.6; }
    50%  { opacity: 0.3; }
    100% { transform: translate(calc(-50% + var(--dx)), -300px) scale(5); opacity: 0; }
  }

  /* Goteos de cera */
  .candle-drip {
    position: absolute;
    top: 0;
    background: linear-gradient(to bottom, #f0ece0, #ddd6c8cc);
    border-radius: 0 0 12px 12px;
    opacity: 0.8;
  }

  /* Luz ambiental en la escena */
  #ambient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 80%, #ff880018 0%, transparent 60%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
    z-index: 2;
  }
  #ambient.visible { opacity: 1; }
</style>
</head>
<body>
<div id="scene">
  <div id="ambient"></div>

  <div id="btn-zone">
    <button id="toggle-btn" onclick="toggleCandle()">Encender</button>
  </div>

  <div id="flame-zone">
    <div id="glow"></div>

    <div id="flame-wrap">
      <svg class="flame-svg" id="flame1" viewBox="0 0 70 200" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fg1" cx="50%" cy="72%" r="52%">
            <stop offset="0%"   stop-color="#fff9cc"/>
            <stop offset="25%"  stop-color="#ffdd00"/>
            <stop offset="55%"  stop-color="#ff8800"/>
            <stop offset="80%"  stop-color="#ff3300"/>
            <stop offset="100%" stop-color="#cc2200" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="fg2" cx="50%" cy="60%" r="48%">
            <stop offset="0%"   stop-color="#ffffff"/>
            <stop offset="20%"  stop-color="#fffde0"/>
            <stop offset="50%"  stop-color="#ffe066"/>
            <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="fg3" cx="50%" cy="80%" r="40%">
            <stop offset="0%"   stop-color="#ff6600" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Base caliente -->
        <ellipse cx="35" cy="152" rx="22" ry="20" fill="url(#fg3)"/>
        <!-- Cuerpo principal de la llama -->
        <path d="M35 198
                 C16 178 4 150 10 112
                 C13 92 22 74 28 56
                 C30 48 32 36 35 18
                 C38 36 40 48 42 56
                 C48 74 57 92 60 112
                 C66 150 54 178 35 198Z"
              fill="url(#fg1)"/>
        <!-- Núcleo interior brillante -->
        <path d="M35 190
                 C22 168 14 144 18 114
                 C21 96 28 80 32 65
                 C33 58 34 48 35 36
                 C36 48 37 58 38 65
                 C42 80 49 96 52 114
                 C56 144 48 168 35 190Z"
              fill="url(#fg2)" opacity="0.92"/>
        <!-- Punto más brillante (centro) -->
        <ellipse cx="35" cy="108" rx="9" ry="28" fill="#fffef0" opacity="0.85"/>
        <ellipse cx="35" cy="118" rx="5" ry="14" fill="#ffffff" opacity="0.6"/>
      </svg>
    </div>

    <div id="smoke-wrap"></div>
  </div>

  <div id="candle-zone">
    <div class="candle-body">
      <!-- Goteos decorativos -->
      <div class="candle-drip" style="left:20px;  width:14px; height:28px;"></div>
      <div class="candle-drip" style="left:55px;  width:10px; height:16px;"></div>
      <div class="candle-drip" style="left:95px;  width:12px; height:22px;"></div>
      <div class="candle-drip" style="right:50px; width:10px; height:18px;"></div>
      <div class="candle-drip" style="right:20px; width:14px; height:32px;"></div>
      <div class="wick" id="main-wick"></div>
    </div>
  </div>
</div>

<script>
  let isLit = false;
  let flickerRaf;
  let smokeTimeout;
  let smokeInterval;

  const flame1    = document.getElementById('flame1');
  const glow      = document.getElementById('glow');
  const ambient   = document.getElementById('ambient');
  const wick      = document.getElementById('main-wick');
  const btn       = document.getElementById('toggle-btn');
  const smokeWrap = document.getElementById('smoke-wrap');

  function flicker() {
    if (!isLit) return;
    const t  = Date.now() / 1000;
    const n1 = Math.sin(t * 7.3)  * 0.09;
    const n2 = Math.sin(t * 13.1) * 0.04;
    const n3 = Math.sin(t * 3.7)  * 0.07;
    const noise = n1 + n2 + n3;

    const scaleX   = 1 + noise * 0.45;
    const scaleY   = 1 + noise * 0.30;
    const skewX    = Math.sin(t * 5.1) * 3;
    const tx       = Math.sin(t * 4.3) * 4;

    flame1.style.transform = `translateX(calc(-50% + ${tx}px)) scaleX(${scaleX}) scaleY(${scaleY}) skewX(${skewX}deg)`;

    const gs = 460 + noise * 100;
    glow.style.width  = gs + 'px';
    glow.style.height = gs + 'px';

    flickerRaf = requestAnimationFrame(flicker);
  }

  function spawnSmoke() {
    const p  = document.createElement('div');
    const dx = (Math.random() - 0.5) * 90;
    const sz = 16 + Math.random() * 20;
    const dur = 1.8 + Math.random() * 1.4;
    p.style.cssText = `
      position: absolute;
      bottom: 0; left: 0;
      width: ${sz}px; height: ${sz}px;
      border-radius: 50%;
      background: #bbb9;
      opacity: 0;
      --dx: ${dx}px;
      animation: smokeRise ${dur}s ease-out forwards;
    `;
    smokeWrap.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000 + 200);
  }

  function startSmoke() {
    smokeInterval = setInterval(spawnSmoke, 140);
    smokeTimeout  = setTimeout(() => {
      clearInterval(smokeInterval);
    }, 3000);
  }

  function toggleCandle() {
    if (!isLit) {
      isLit = true;
      flame1.classList.add('visible');
      glow.classList.add('visible');
      ambient.classList.add('visible');
      wick.classList.add('lit');
      btn.textContent = 'Apagar';
      btn.classList.remove('off');
      flicker();
    } else {
      isLit = false;
      cancelAnimationFrame(flickerRaf);
      flame1.classList.remove('visible');
      glow.classList.remove('visible');
      ambient.classList.remove('visible');
      wick.classList.remove('lit');
      flame1.style.transform = 'translateX(-50%)';
      btn.textContent = 'Encender';
      btn.classList.add('off');
      clearTimeout(smokeTimeout);
      clearInterval(smokeInterval);
      startSmoke();
    }
  }
</script>
</body>
</html>
