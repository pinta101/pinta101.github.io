<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela Animada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }
  #scene {
    width: 100%;
    height: 100vh;
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: #0a0a12;
    position: relative;
    overflow: hidden;
  }
  #btn-zone {
    height: 25%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #toggle-btn {
    width: 50%;
    max-width: 220px;
    padding: 14px 0;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    background: linear-gradient(135deg, #c8860a, #e8b44a);
    color: #fff;
    box-shadow: 0 4px 24px #e8b44a44;
    transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
  }
  #toggle-btn:active { transform: scale(0.97); }
  #toggle-btn.off {
    background: linear-gradient(135deg, #333, #555);
    box-shadow: 0 4px 18px #00000066;
  }
  #flame-zone {
    height: 50%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 5;
  }
  #candle-zone {
    height: 25%;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 6;
  }
  .candle-body {
    width: 80px;
    height: 100%;
    background: linear-gradient(to right, #e8e0d0 0%, #f5f0e8 30%, #fff 55%, #e8e4da 80%, #d0c8b8 100%);
    border-radius: 8px 8px 4px 4px;
    position: relative;
    box-shadow: 2px 0 12px #0005, -2px 0 8px #0003;
  }
  .wick {
    width: 3px;
    height: 22px;
    background: #3a2a10;
    border-radius: 2px;
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
  }
  .wick::after {
    content: '';
    width: 5px;
    height: 5px;
    background: #ff6a00;
    border-radius: 50%;
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .wick.lit::after { opacity: 1; }
  #flame-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 200px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  .flame-svg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 200px;
    opacity: 0;
    transition: opacity 0.6s;
    filter: blur(0.5px);
  }
  .flame-svg.visible { opacity: 1; }
  #glow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(ellipse at 50% 80%, #ffb30088 0%, #ff6a0033 40%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s;
    border-radius: 50%;
    z-index: 4;
  }
  #glow.visible { opacity: 1; }
  #smoke-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 180px;
    pointer-events: none;
    z-index: 8;
    overflow: visible;
  }
  .smoke-particle {
    position: absolute;
    bottom: 30px;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #aaa8;
    transform: translateX(-50%);
    opacity: 0;
    animation: none;
  }
  @keyframes smokeRise {
    0%   { transform: translateX(-50%) translateY(0) scale(0.5); opacity: 0.5; }
    40%  { opacity: 0.35; }
    100% { transform: translateX(calc(-50% + var(--dx))) translateY(-140px) scale(3.5); opacity: 0; }
  }
  .candle-drip {
    position: absolute;
    top: 8px;
    width: 12px;
    height: 28px;
    background: linear-gradient(to bottom, #f0ece0, #ddd6c8);
    border-radius: 0 0 8px 8px;
    opacity: 0.7;
  }
  #ambient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 75%, #ff990015 0%, transparent 65%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s;
    z-index: 2;
  }
  #ambient.visible { opacity: 1; }
</style>
</head>
<body>
<div id="scene">
  <div id="ambient"></div>

  <div id="btn-zone">
    <button id="toggle-btn" onclick="toggleCandle()">Encender</button>
  </div>

  <div id="flame-zone">
    <div id="glow"></div>
    <div id="flame-wrap">
      <svg class="flame-svg" id="flame1" viewBox="0 0 70 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fg1" cx="50%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#fff7aa"/>
            <stop offset="35%" stop-color="#ffcc00"/>
            <stop offset="65%" stop-color="#ff7700"/>
            <stop offset="100%" stop-color="#cc2200" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="fg2" cx="50%" cy="60%" r="50%">
            <stop offset="0%" stop-color="#fffde0"/>
            <stop offset="40%" stop-color="#ffe066"/>
            <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="35" cy="140" rx="18" ry="22" fill="#ff5500" opacity="0.35"/>
        <path d="M35 195 C20 170 8 140 15 105 C18 88 28 72 35 50 C42 72 52 88 55 105 C62 140 50 170 35 195Z" fill="url(#fg1)"/>
        <path d="M35 185 C25 162 16 138 22 110 C26 93 32 78 35 60 C38 78 44 93 48 110 C54 138 45 162 35 185Z" fill="url(#fg2)" opacity="0.9"/>
        <ellipse cx="35" cy="100" rx="10" ry="30" fill="#fffde0" opacity="0.7"/>
      </svg>
    </div>
    <div id="smoke-wrap"></div>
  </div>

  <div id="candle-zone">
    <div class="candle-body">
      <div class="candle-drip" style="left:10px; height:18px;"></div>
      <div class="candle-drip" style="right:14px; height:24px;"></div>
      <div class="wick" id="main-wick"></div>
    </div>
  </div>
</div>

<script>
  let isLit = false;
  let flickerRaf;
  let smokeTimeout;
  let smokeInterval;
  const flame1 = document.getElementById('flame1');
  const glow = document.getElementById('glow');
  const ambient = document.getElementById('ambient');
  const wick = document.getElementById('main-wick');
  const btn = document.getElementById('toggle-btn');
  const smokeWrap = document.getElementById('smoke-wrap');

  function flicker() {
    if (!isLit) return;
    const t = Date.now() / 1000;
    const noise = Math.sin(t * 7.3) * 0.08 + Math.sin(t * 13.1) * 0.04 + Math.sin(t * 3.7) * 0.06;
    const scaleX = 1 + noise * 0.5;
    const scaleY = 1 + noise * 0.35;
    const skewX = Math.sin(t * 5.1) * 2.5;
    const translateX = Math.sin(t * 4.3) * 2;
    flame1.style.transform = `translateX(calc(-50% + ${translateX}px)) scaleX(${scaleX}) scaleY(${scaleY}) skewX(${skewX}deg)`;
    const glowSize = 180 + noise * 60;
    glow.style.width = glowSize + 'px';
    glow.style.height = glowSize + 'px';
    flickerRaf = requestAnimationFrame(flicker);
  }

  function spawnSmoke() {
    const p = document.createElement('div');
    p.className = 'smoke-particle';
    const dx = (Math.random() - 0.5) * 40;
    p.style.setProperty('--dx', dx + 'px');
    p.style.left = (50 + (Math.random()-0.5)*10) + '%';
    p.style.width = (8 + Math.random()*8) + 'px';
    p.style.height = p.style.width;
    p.style.animation = `smokeRise ${1.5 + Math.random()}s ease-out forwards`;
    smokeWrap.appendChild(p);
    setTimeout(() => p.remove(), 2600);
  }

  function startSmoke() {
    smokeInterval = setInterval(spawnSmoke, 180);
    smokeTimeout = setTimeout(stopSmoke, 3000);
  }

  function stopSmoke() {
    clearInterval(smokeInterval);
  }

  function toggleCandle() {
    if (!isLit) {
      isLit = true;
      flame1.classList.add('visible');
      glow.classList.add('visible');
      ambient.classList.add('visible');
      wick.classList.add('lit');
      btn.textContent = 'Apagar';
      btn.classList.remove('off');
      flicker();
    } else {
      isLit = false;
      cancelAnimationFrame(flickerRaf);
      flame1.classList.remove('visible');
      glow.classList.remove('visible');
      ambient.classList.remove('visible');
      wick.classList.remove('lit');
      flame1.style.transform = 'translateX(-50%)';
      btn.textContent = 'Encender';
      btn.classList.add('off');
      clearTimeout(smokeTimeout);
      clearInterval(smokeInterval);
      startSmoke();
    }
  }
</script>
</body>
</html>
