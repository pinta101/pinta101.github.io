<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego de la Vela Mágica - Agita tu móvil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            padding: 30px 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .candle-card {
            background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
            border-radius: 50px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ffd966;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #ffb347;
            margin-bottom: 30px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Escenario de la vela */
        .candle-scene {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 30px 0;
            cursor: pointer;
        }

        .candle {
            position: relative;
            width: 80px;
            height: 180px;
            background: linear-gradient(90deg, #f5deb3, #e3c494, #f5deb3);
            border-radius: 40px 40px 20px 20px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        /* Pabilo */
        .wick {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 12px;
            background: #4a2a1a;
            border-radius: 2px;
            z-index: 2;
        }

        /* Llama (apagada) */
        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            background: transparent;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: blur(2px);
            opacity: 0;
            z-index: 3;
        }

        .flame.lit {
            opacity: 1;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle, #ff7e05, #ff4400);
            box-shadow: 0 0 20px 10px rgba(255, 100, 0, 0.8);
            animation: flicker 0.12s infinite alternate;
        }

        /* Dripping wax efecto */
        .candle::before {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 20px;
            background: rgba(255, 200, 150, 0.4);
            border-radius: 10px;
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 15px 5px rgba(255, 100, 0, 0.8);
            }
            100% {
                transform: translateX(-50%) scale(1.08);
                box-shadow: 0 0 28px 12px rgba(255, 80, 0, 1);
            }
        }

        /* Indicadores y controles */
        .shake-indicator {
            background: #000000aa;
            border-radius: 60px;
            padding: 20px;
            margin: 25px 0;
            text-align: center;
        }

        .shake-meter {
            background: #2c2c2c;
            border-radius: 30px;
            height: 18px;
            width: 100%;
            overflow: hidden;
            margin: 10px 0;
        }

        .shake-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa33, #ff6a00);
            border-radius: 30px;
            transition: width 0.05s linear;
            box-shadow: 0 0 5px #ffaa33;
        }

        .shake-text {
            font-size: 0.9rem;
            color: #eee;
            margin-top: 8px;
            font-weight: bold;
        }

        .progress-text {
            font-size: 1.2rem;
            color: #ffaa66;
            font-weight: bold;
        }

        button {
            background: #ff8c42;
            border: none;
            padding: 12px 28px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 40px;
            color: #2c1a0c;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 0 #a23f00;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a23f00;
        }

        .message-area {
            margin-top: 20px;
            font-size: 1rem;
            background: #00000077;
            border-radius: 40px;
            padding: 8px 15px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #ccc;
            text-align: center;
        }

        @media (max-width: 550px) {
            .candle {
                width: 65px;
                height: 150px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        .shake-icon {
            font-size: 2rem;
            display: inline-block;
            animation: none;
        }

        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="candle-card">
        <h1>🕯️ VELA MÁGICA ✨</h1>
        <div class="subtitle">¡Agita tu móvil para encenderla!</div>

        <div class="candle-scene">
            <div class="candle">
                <div class="wick"></div>
                <div class="flame" id="flame"></div>
            </div>
        </div>

        <div class="shake-indicator">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span class="shake-icon" id="shakeIcon">📳</span>
                <span class="progress-text" id="energyPercent">0%</span>
            </div>
            <div class="shake-meter">
                <div class="shake-fill" id="shakeFill"></div>
            </div>
            <div class="shake-text" id="shakeMessage">
                💪 ¡Agita el teléfono con fuerza!
            </div>
        </div>

        <button id="resetBtn">🔄 Reiniciar Vela</button>
        <div class="message-area" id="stateMessage">
            🔥 Vela apagada - Agita para encender
        </div>
        <div class="footer">
            ⚡ Movimiento brusco = más energía 🔥
        </div>
    </div>
</div>

<script>
    // Elementos del DOM
    const flame = document.getElementById('flame');
    const shakeFill = document.getElementById('shakeFill');
    const energyPercentSpan = document.getElementById('energyPercent');
    const shakeMessageDiv = document.getElementById('shakeMessage');
    const stateMessageSpan = document.getElementById('stateMessage');
    const resetBtn = document.getElementById('resetBtn');
    const shakeIcon = document.getElementById('shakeIcon');

    // Variables de estado
    let isLit = false;           // ¿La vela está encendida?
    let shakeEnergy = 0;         // 0 a 100 -> energía acumulada para encender
    const NEED_ENERGY = 100;     // energía necesaria para encender
    let lastShakeTime = 0;
    let shakeThreshold = 14;      // sensibilidad inicial (ajustable para móvil/PC)
    
    // Variables para la detección de movimiento (DeviceMotion)
    let lastX = null, lastY = null, lastZ = null;
    let shakeInterval = null;
    let motionSupported = false;
    
    // Elementos auxiliares para vibración si está disponible (opcional)
    const hasVibrate = 'vibrate' in navigator;

    // Actualizar la interfaz visual según energía y estado
    function updateUI() {
        // Actualizar barra de energía
        let percent = Math.min(100, Math.max(0, shakeEnergy));
        shakeFill.style.width = percent + '%';
        energyPercentSpan.innerText = Math.floor(percent) + '%';
        
        // Si la vela está encendida, mostrar llama y mensaje especial
        if (isLit) {
            flame.classList.add('lit');
            stateMessageSpan.innerHTML = '🎉 ¡LA VELA ESTÁ ENCENDIDA! 🎉 <br> ✨ Brilla con intensidad ✨';
            shakeMessageDiv.innerHTML = '✅ ¡Vela encendida! Agita para mantenerla brillante ✨';
            shakeFill.style.background = "linear-gradient(90deg, #ffaa33, #ff5500)";
            // Si está encendida y aún hay energía máxima, no se pierde, pero se puede mantener el efecto
        } else {
            flame.classList.remove('lit');
            if (shakeEnergy <= 0) {
                stateMessageSpan.innerHTML = '🕯️ Vela apagada - ¡Agita el móvil para encender!';
                shakeMessageDiv.innerHTML = '💪 ¡Agita con energía! Acumula 100% 💪';
            } else {
                stateMessageSpan.innerHTML = `⚡ Energía acumulada: ${Math.floor(percent)}% - ¡Sigue agitando!`;
                shakeMessageDiv.innerHTML = `🌀 ¡Buen movimiento! +${lastDelta || '?'} energía. Faltan ${NEED_ENERGY - shakeEnergy}% 🌀`;
            }
            shakeFill.style.background = "linear-gradient(90deg, #ffaa33, #ff6a00)";
        }
        
        // Si está al 100% pero no encendida (por si acaso, encendemos automático)
        if (!isLit && shakeEnergy >= NEED_ENERGY) {
            lightCandle();
        }
        
        // Animar ícono de agitación si está acumulando energía sin estar prendida
        if (!isLit && shakeEnergy > 0 && shakeEnergy < NEED_ENERGY) {
            shakeIcon.style.animation = 'shakeAnim 0.3s ease-in-out';
            setTimeout(() => { if(shakeIcon) shakeIcon.style.animation = ''; }, 300);
        } else {
            shakeIcon.style.animation = '';
        }
    }
    
    // Función para encender la vela
    function lightCandle() {
        if (isLit) return;
        isLit = true;
        shakeEnergy = NEED_ENERGY;   // llena la barra
        updateUI();
        // Efecto de vibración al encender (si soporta)
        if (hasVibrate) {
            navigator.vibrate([100, 50, 100]);
        }
        // Mensaje especial temporal
        shakeMessageDiv.innerHTML = '✨✨ ¡MAGIA! VELA ENCENDIDA ✨✨';
        setTimeout(() => {
            if(isLit) shakeMessageDiv.innerHTML = '🕯️ La vela brilla intensamente. Agita para dar más energía ✨';
        }, 1500);
        // Disparar evento de sonido simbólico (no real pero feedback)
        console.log("¡Vela encendida por agitación!");
    }
    
    // Reiniciar la vela (apagar, resetear energía)
    function resetCandle() {
        isLit = false;
        shakeEnergy = 0;
        updateUI();
        if (hasVibrate) {
            navigator.vibrate(50);
        }
        shakeMessageDiv.innerHTML = '💪 ¡Vela reiniciada! Agita para volver a encender 💪';
        setTimeout(() => {
            if(!isLit) shakeMessageDiv.innerHTML = '💪 ¡Agita el teléfono con fuerza!';
        }, 1500);
        // Refrescar mensaje de estado
        stateMessageSpan.innerHTML = '🕯️ Vela apagada - ¡Agita el móvil!';
    }
    
    let lastDelta = 0;
    
    // Detección de movimiento / agitación
    function handleMotion(event) {
        if (!event.accelerationIncludingGravity) return;
        
        let acceleration = event.accelerationIncludingGravity;
        let curX = acceleration.x;
        let curY = acceleration.y;
        let curZ = acceleration.z;
        
        if (lastX !== null && lastY !== null && lastZ !== null) {
            // Calculamos la diferencia entre ejes (movimiento brusco)
            let deltaX = Math.abs(curX - lastX);
            let deltaY = Math.abs(curY - lastY);
            let deltaZ = Math.abs(curZ - lastZ);
            let totalDelta = deltaX + deltaY + deltaZ;
            
            // Sensibilidad adaptativa: si la vela está apagada se necesita más "fuerza" para subir rápido
            // pero mientras más delta mayor energía ganada.
            if (totalDelta > shakeThreshold) {
                // Si la vela ya está encendida -> se puede mantener efecto visual pero sin cambiar estado?
                // En lugar de seguir sumando energía mantiene el efecto divertido: se puede agregar un pequeño
                // bonus de energía extra (si quieres que agitar mientras está encendida haga un efecto brillo)
                if (!isLit) {
                    // Calcular ganancia basada en intensidad del movimiento (máx 12 por movimiento)
                    let gain = Math.min(12, Math.floor(totalDelta / 3.5));
                    if (gain < 2 && totalDelta > 12) gain = 2;
                    gain = Math.max(1, gain);
                    // Evitar ganancias demasiado rápidas en un solo frame
                    shakeEnergy = Math.min(NEED_ENERGY, shakeEnergy + gain);
                    lastDelta = gain;
                    
                    // Actualizar UI
                    updateUI();
                    
                    // Pequeña vibración al recibir impacto (feedback táctil)
                    if (hasVibrate && gain > 3) {
                        navigator.vibrate(30);
                    }
                    
                    // Mostrar efecto rápido de texto temporal
                    if (gain > 0) {
                        const msgDiv = shakeMessageDiv;
                        msgDiv.style.transform = 'scale(1.02)';
                        setTimeout(() => { if(msgDiv) msgDiv.style.transform = ''; }, 120);
                    }
                } else {
                    // Vela encendida: Agitar hace un efecto "llama más brillante" temporalmente
                    flame.style.animation = 'flicker 0.08s infinite alternate';
                    flame.style.filter = 'blur(3px) brightness(1.4)';
                    if (hasVibrate) navigator.vibrate(20);
                    setTimeout(() => {
                        if (isLit) {
                            flame.style.animation = 'flicker 0.12s infinite alternate';
                            flame.style.filter = '';
                        }
                    }, 200);
                    // Mensaje entretenido
                    shakeMessageDiv.innerHTML = '✨ ¡La llama baila con tu movimiento! ✨';
                    setTimeout(() => {
                        if(isLit) shakeMessageDiv.innerHTML = '🕯️ La vela brilla intensamente. Agita para dar más energía ✨';
                    }, 800);
                }
            }
        }
        
        // Actualizar valores anteriores
        lastX = curX;
        lastY = curY;
        lastZ = curZ;
    }
    
    // Solicitar permisos para iOS 13+ (DeviceMotion requiere permiso explícito)
    function requestMotionPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            // iOS necesita autorización del usuario
            const permissionButton = document.createElement('button');
            permissionButton.innerText = '🎯 Activar movimiento para jugar';
            permissionButton.style.position = 'fixed';
            permissionButton.style.bottom = '20px';
            permissionButton.style.left = '50%';
            permissionButton.style.transform = 'translateX(-50%)';
            permissionButton.style.zIndex = '1000';
            permissionButton.style.backgroundColor = '#ff8c42';
            permissionButton.style.padding = '12px 20px';
            permissionButton.style.borderRadius = '50px';
            permissionButton.style.border = 'none';
            permissionButton.style.fontWeight = 'bold';
            permissionButton.style.cursor = 'pointer';
            permissionButton.style.boxShadow = '0 4px 10px black';
            document.body.appendChild(permissionButton);
            
            permissionButton.addEventListener('click', () => {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            permissionButton.remove();
                            motionSupported = true;
                            showSuccessMotion();
                        } else {
                            permissionButton.innerText = '⚠️ Permiso denegado, agita en PC con mouse?';
                            setTimeout(() => permissionButton.remove(), 2000);
                        }
                    })
                    .catch(console.error);
            });
        } else {
            // Android / escritorio normal: directamente agregar evento
            window.addEventListener('devicemotion', handleMotion);
            motionSupported = true;
            showSuccessMotion();
        }
    }
    
    function showSuccessMotion() {
        const infoMsg = document.createElement('div');
        infoMsg.style.position = 'fixed';
        infoMsg.style.bottom = '70px';
        infoMsg.style.left = '50%';
        infoMsg.style.transform = 'translateX(-50%)';
        infoMsg.style.backgroundColor = '#4caf50';
        infoMsg.style.color = 'white';
        infoMsg.style.padding = '6px 15px';
        infoMsg.style.borderRadius = '40px';
        infoMsg.style.fontSize = '0.8rem';
        infoMsg.style.zIndex = '999';
        infoMsg.innerText = '✅ Movimiento detectado! ¡Agita el móvil!';
        document.body.appendChild(infoMsg);
        setTimeout(() => infoMsg.remove(), 2500);
    }
    
    // Alternativa para escritorio / simulación: también agregar detección por mouse/touch para demo
    let mouseShakeMode = false;
    let lastMouseX = null, lastMouseY = null;
    function addDesktopShakeAlternative() {
        // Para escritorios sin acelerómetro, permitir simular agitación moviendo el ratón rápidamente de un lado a otro
        let mouseMoveCount = 0;
        let lastMoveTime = 0;
        window.addEventListener('mousemove', (e) => {
            if (isLit && !motionSupported) {
                // si no hay motion pero el usuario mueve mouse rápido, efecto divertido pero no enciende realmente
                return;
            }
            if (!motionSupported && !isLit) {
                // Modo "simulación": si no hay device motion y estamos en escritorio, podemos permitir que mover el mouse/arrastrar simule agitación suave.
                if (lastMouseX !== null && lastMouseY !== null) {
                    let deltaMove = Math.abs(e.clientX - lastMouseX) + Math.abs(e.clientY - lastMouseY);
                    if (deltaMove > 25 && (Date.now() - lastMoveTime) > 80) {
                        if (!isLit) {
                            let gainSim = Math.min(5, Math.floor(deltaMove / 20));
                            shakeEnergy = Math.min(NEED_ENERGY, shakeEnergy + gainSim);
                            lastDelta = gainSim;
                            updateUI();
                            if(hasVibrate && gainSim > 2) navigator.vibrate(20);
                        }
                        lastMoveTime = Date.now();
                    }
                }
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            } else {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // También para touch (móviles sin acelerómetro? raro pero puede servir)
        window.addEventListener('touchmove', (e) => {
            if (!motionSupported && !isLit && e.touches.length) {
                const touch = e.touches[0];
                if (lastMouseX && lastMouseY) {
                    let deltaT = Math.abs(touch.clientX - lastMouseX) + Math.abs(touch.clientY - lastMouseY);
                    if (deltaT > 20) {
                        let gainSim = Math.min(5, Math.floor(deltaT / 18));
                        shakeEnergy = Math.min(NEED_ENERGY, shakeEnergy + gainSim);
                        lastDelta = gainSim;
                        updateUI();
                    }
                }
                lastMouseX = touch.clientX;
                lastMouseY = touch.clientY;
            }
        });
    }
    
    // Inicializar y detectar si hay soporte
    function init() {
        resetBtn.addEventListener('click', resetCandle);
        updateUI();
        // Comprobar si el dispositivo soporta DeviceMotion (la mayoría móviles sí)
        if (window.DeviceMotionEvent) {
            requestMotionPermission();
        } else {
            // No hay soporte para acelerómetro, mostrar mensaje y alternativa manual con mouse/touch
            motionSupported = false;
            const noMotionMsg = document.getElementById('shakeMessage');
            if(noMotionMsg) noMotionMsg.innerHTML = '📱 Tu navegador no soporta acelerómetro. Usa el ratón o desliza rápido para encender! 🔥';
            addDesktopShakeAlternative();
        }
        
        // Incluso si hay motion, agregamos alternativa de respaldo sutil pero no conflictiva
        if (!window.DeviceMotionEvent) {
            // nada más
        }
        
        // Prevenir scroll por agitación en móviles
        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('.game-container')) {
                // No interfiere
            }
        }, { passive: false });
    }
    
    // Llamar a init cuando cargue
    window.addEventListener('load', init);
</script>
</body>
</html>
