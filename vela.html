<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sopla la Vela</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        /* Contenedor principal */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tu imagen GIF subida */
        #vela-gif {
            display: none; /* Empieza oculta */
            width: auto;
            height: 100%;
            max-height: 90vh; /* Para que no toque los bordes */
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        /* Efecto de humo CSS */
        #smoke-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(200,200,200,0.5) 0%, rgba(0,0,0,1) 80%);
            filter: blur(20px);
            z-index: 2;
            animation: smoke-dissipate 3s forwards;
            pointer-events: none;
        }

        @keyframes smoke-dissipate {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            15% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.4) translateY(-60px); }
        }

        /* Botón de inicio necesario por permisos */
        #btn-start {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
        }

        #status {
            position: absolute;
            bottom: 30px;
            width: 100%;
            font-size: 0.9rem;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="btn-start">Activar Sensores</button>
        
        <img id="vela-gif" src="vela.gif" alt="Vela">
        
        <div id="smoke-overlay"></div>

        <p id="status">Primero, pulsa el botón.</p>
    </div>

    <script>
        const vela = document.getElementById('vela-gif');
        const smoke = document.getElementById('smoke-overlay');
        const status = document.getElementById('status');
        const btn = document.getElementById('btn-start');

        let state = "OFF"; // Estados: OFF, ON, SMOKE
        let lastX, lastY, lastZ;
        const threshold = 18; // Ajusta la sensibilidad del agite

        function requestPermission() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startMotionListener();
                        }
                    });
            } else {
                startMotionListener();
            }
            btn.style.display = 'none';
            status.innerText = "Agita 1 vez para encender.";
        }

        function startMotionListener() {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (!acc) return;

                // Detectar el cambio brusco de aceleración
                let deltaX = Math.abs(lastX - acc.x);
                let deltaY = Math.abs(lastY - acc.y);
                let deltaZ = Math.abs(lastZ - acc.z);

                if (deltaX + deltaY + deltaZ > threshold) {
                    handleShake();
                }

                lastX = acc.x;
                lastY = acc.y;
                lastZ = acc.z;
            });
        }

        function handleShake() {
            // Lógica principal
            if (state === "OFF") {
                // PRIMER AGITE: ENCIENDE
                state = "ON";
                vela.style.display = 'block';
                status.innerText = "¡Encendida! Agita de nuevo para apagar.";
            } 
            else if (state === "ON") {
                // SEGUNDO AGITE: APAGA CON HUMO
                state = "SMOKE";
                vela.style.display = 'none';
                smoke.style.display = 'block';
                status.innerText = "Soplando...";

                // El humo dura 3 segundos antes de resetear el juego
                setTimeout(() => {
                    smoke.style.display = 'none';
                    state = "OFF";
                    status.innerText = "Agita 1 vez para encender.";
                }, 3000);
            }
            // Si está en estado SMOKE, ignoramos los agites
        }

        btn.addEventListener('click', requestPermission);
    </script>
</body>
</html>
