<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafío d'genes - Logos Grandes</title>
    <style>
        :root {
            --dgenes-orange: #f39237; 
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #ui-layer {
            text-align: center;
            padding: 10px 0;
            min-height: 140px;
            z-index: 100;
        }

        h1 { color: var(--dgenes-orange); margin: 0; font-size: 1.1rem; text-transform: uppercase; }
        #timer { font-size: 3.8rem; color: var(--red); font-weight: bold; line-height: 1.1; }
        
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
        }

        .logo {
            position: absolute;
            height: auto;
            pointer-events: none;
            z-index: 5;
            animation: flash-animation 2.2s infinite ease-in-out;
        }

        @keyframes flash-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        .btn-opcion {
            background-color: var(--dgenes-orange);
            border: none;
            color: white;
            padding: 15px 35px;
            margin: 8px;
            font-size: 22px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b36b29;
            min-width: 80px;
        }

        .hidden { display: none !important; }

        #error-screen {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 320px;
            text-align: center;
            background: #111;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--red);
            z-index: 300;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
            z-index: 999;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(40); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">d'genes</h1>
        <div id="timer" class="hidden">5</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion" onclick="startGame()">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 style="color: var(--red); margin-top: 0;">¡Incorrecto!</h2>
            <p id="error-info" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        const logoURL = "dgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let lastPieceCount = 4; 
        let timerInterval;
        let placedLogos = [];

        function isOverlapping(newX, newY, newWidth, newHeight) {
            const padding = 5; // Menos padding para permitir que quepan al ser más grandes
            for (let logo of placedLogos) {
                if (newX < logo.x + logo.width + padding &&
                    newX + newWidth + padding > logo.x &&
                    newY < logo.y + logo.height + padding &&
                    newY + newHeight + padding > logo.y) {
                    return true;
                }
            }
            return false;
        }

        function startGame() {
            startBtn.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            lastPieceCount = 4; 
            errorScreen.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { victory(); return; }

            document.getElementById('title').innerText = "Nivel " + currentLevel + " / 10";
            optionsContainer.classList.add('hidden');
            
            const oldLogos = document.querySelectorAll('.logo');
            oldLogos.forEach(l => l.remove());
            placedLogos = [];
            
            timerDisplay.classList.remove('hidden');

            // --- TIEMPOS ---
            let timeForLevel = 5;
            if (currentLevel <= 3) timeForLevel = 5;
            else if (currentLevel <= 6) timeForLevel = 10;
            else if (currentLevel <= 8) timeForLevel = 15;
            else timeForLevel = 20;

            // --- PROGRESIÓN (IGUAL O MÁS) ---
            let increment = Math.floor(Math.random() * 2) + 1; 
            correctCount = lastPieceCount + increment;
            
            if (currentLevel >= 9 && correctCount < 18) correctCount = 20; 
            lastPieceCount = correctCount;

            // --- GENERACIÓN DE LOGOS MÁS GRANDES ---
            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight - 40;

            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // TAMAÑO AUMENTADO: 60px a 110px de ancho
                const finalWidth = Math.floor(Math.random() * 51) + 60; 
                img.style.width = finalWidth + "px";
                
                let x, y, width, height, overlaps;
                let attempts = 0;
                width = finalWidth;
                height = finalWidth * 0.45;

                do {
                    const posX = Math.random() * 75 + 10; 
                    const posY = Math.random() * 60 + 10; 
                    x = (posX / 100) * areaWidth - (width / 2);
                    y = (posY / 100) * areaHeight;

                    if (x < 5) x = 5;
                    if (x + width > areaWidth - 5) x = areaWidth - width - 5;

                    overlaps = isOverlapping(x, y, width, height);
                    attempts++;
                    if (attempts > 60) overlaps = false; 
                } while (overlaps);

                placedLogos.push({ x, y, width, height });

                img.style.left = x + "px";
                img.style.top = y + "px";
                img.style.transform = "rotate(" + (Math.random() * 24 - 12) + "deg)";
                img.style.animationDelay = (Math.random() * 2) + "s";

                gameArea.appendChild(img);
            }

            startTimer(timeForLevel);
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            const logos = document.querySelectorAll('.logo');
            logos.forEach(l => l.remove());

            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            // OPCIONES CON 1 UNIDAD DE DIFERENCIA
            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if (num >= 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => {
                        if (parseInt(btn.innerText) === correctCount) {
                            currentLevel++;
                            nextLevel();
                        } else {
                            showError();
                        }
                    };
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = "Había " + correctCount + " logotipos.";
        }

        function victory() {
            document.getElementById('title').innerText = "¡MAESTRO D'GENES!";
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Jugar de Nuevo</button>';
            optionsContainer.classList.remove('hidden');
            setInterval(createFirework, 250);
        }

        function createFirework() {
            const colors = ['#f39237', '#e91e63', '#ffffff', '#00bcd4', '#4caf50'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            const color = colors[Math.floor(Math.random() * colors.length)];
            fw.style.backgroundColor = color;
            fw.style.boxShadow = `0 0 20px 5px ${color}`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }
    </script>
</body>
</html>
