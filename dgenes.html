<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío d'genes - 20 Segundos</title>
    <style>
        :root {
            --orange: #f39237;
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) 5px env(safe-area-inset-bottom) 5px;
        }

        #ui-layer {
            flex-shrink: 0;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        h1 { color: var(--orange); margin: 0; font-size: 1.2rem; }
        #timer { font-size: 3.5rem; color: var(--red); font-weight: bold; line-height: 1; }
        
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            width: 140px;
            height: auto;
            pointer-events: none;
            user-select: none;
        }

        /* ANIMACIÓN DE PARPADEO LENTO */
        @keyframes flash-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        .btn-opcion {
            background-color: var(--orange);
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 5px;
            font-size: 20px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 0 #b36b29;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        #error-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 300px;
            text-align: center;
            background: rgba(20, 20, 20, 0.98);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--red);
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.2);
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Desafío d'genes</h1>
        <div id="timer" class="hidden">20</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion" onclick="startGame()">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 style="color: var(--red); margin: 0;">¡Incorrecto!</h2>
            <p id="error-info" style="margin: 15px 0; font-size: 1.1rem;"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        const logoURL = "logodgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timerInterval;

        function startGame() {
            startBtn.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            errorScreen.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { alert("¡Felicidades! Has completado el desafío."); location.reload(); return; }
            
            document.getElementById('title').innerText = `Nivel ${currentLevel} / 10`;
            optionsContainer.classList.add('hidden');
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.remove('hidden');
            
            // Cantidad progresiva
            correctCount = Math.floor(Math.random() * 4) + (currentLevel * 1.5 + 3);
            correctCount = Math.floor(correctCount);

            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // Zona segura: Más margen izquierdo y sube más arriba
                const posX = Math.random() * 50 + 25; 
                const posY = Math.random() * 65 + 2;  

                img.style.left = `calc(${posX}% - 70px)`; 
                img.style.top = posY + '%';
                img.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;

                // PARPADEO MÁS LENTO (1.5s a 2.5s)
                const speed = (Math.random() * 1.0 + 1.5).toFixed(2);
                img.style.animation = `flash-animation ${speed}s infinite ease-in-out`;
                img.style.animationDelay = `${Math.random() * 2}s`;

                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            let timeLeft = 20; // TIEMPO AMPLIADO A 20 SEGUNDOS
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            // Opciones: una menos, la correcta, una más
            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if(num >= 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => {
                        if (num === correctCount) { currentLevel++; nextLevel(); }
                        else { showError(); }
                    };
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = `Había ${correctCount} logotipos.`;
        }
    </script>
</body>
</html>
