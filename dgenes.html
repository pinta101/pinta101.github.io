<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío d'genes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        #ui-layer {
            flex-shrink: 0;
            text-align: center;
            min-height: 150px;
            z-index: 100;
            position: relative;
        }

        h1 { color: #f39237; margin: 10px 0; font-size: 1.5rem; }
        #timer { font-size: 3.5rem; color: #ff4d4d; font-weight: bold; }
        
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            border: 1px solid #111; /* Delimita el área visualmente */
        }

        .logo {
            position: absolute;
            width: 90px;
            height: auto;
            pointer-events: none;
            user-select: none;
        }

        .btn-opcion {
            background-color: #f39237;
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 0 #b36b29;
            cursor: pointer;
            position: relative;
            z-index: 101;
        }

        .btn-opcion:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b36b29;
        }

        .hidden { display: none !important; }

        #error-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #f39237;
            z-index: 200;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Desafío d'genes</h1>
        <p id="instruction" style="color:#aaa;">Presiona para jugar</p>
        <div id="timer" class="hidden">10</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 style="color: #ff4d4d;">¡Nivel Fallido!</h2>
            <p id="error-info"></p>
            <button class="btn-opcion" id="retry-btn">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const titleDisplay = document.getElementById('title');
        const instructionDisplay = document.getElementById('instruction');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        const logoURL = "logodgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timeLeft = 10;
        let timerInterval;

        // Función para limpiar logos
        function clearLogos() {
            const currentLogos = document.querySelectorAll('.logo');
            currentLogos.forEach(l => l.remove());
        }

        // Función para manejar el inicio/reinicio
        function resetGame() {
            currentLevel = 1;
            errorScreen.classList.add('hidden');
            startBtn.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { 
                victory(); 
                return; 
            }

            titleDisplay.innerText = `Nivel ${currentLevel} / 10`;
            instructionDisplay.innerText = "¡Cuenta los logotipos!";
            optionsContainer.classList.add('hidden');
            clearLogos();
            
            timerDisplay.classList.remove('hidden');
            
            // Cantidad progresiva
            correctCount = Math.floor(Math.random() * 3) + (currentLevel * 2 + 1);
            
            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // Zona central segura para móviles
                const posX = Math.random() * 60 + 10; 
                const posY = Math.random() * 60 + 10; 

                img.style.left = posX + '%';
                img.style.top = posY + '%';
                img.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            clearLogos();
            timerDisplay.classList.add('hidden');
            instructionDisplay.innerText = "¿Cuántos había?";
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if(num >= 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => {
                        if (num === correctCount) {
                            currentLevel++;
                            nextLevel();
                        } else {
                            showError();
                        }
                    };
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = `Había ${correctCount} logos.`;
            clearLogos();
        }

        function victory() {
            titleDisplay.innerText = "¡VICTORIA!";
            instructionDisplay.innerText = "¡Lo lograste!";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Reiniciar</button>';
            optionsContainer.classList.remove('hidden');
            setInterval(createFirework, 250);
        }

        function createFirework() {
            const colors = ['#f39237', '#ff4d4d', '#ffffff', '#00f2ff'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            const color = colors[Math.floor(Math.random() * colors.length)];
            fw.style.backgroundColor = color;
            fw.style.boxShadow = `0 0 20px 5px ${color}`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }

        // Listeners de eventos
        startBtn.onclick = resetGame;
        retryBtn.onclick = resetGame;
    </script>
</body>
</html>
