<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío d'genes - Conteo Rápido</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 80vh;
        }

        .logo {
            position: absolute;
            width: 80px;
            transition: opacity 0.3s;
        }

        #ui-layer {
            text-align: center;
            z-index: 100;
        }

        .btn-opcion {
            background-color: #f39237; /* Color naranja del logo */
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-opcion:hover {
            background-color: #d17a2a;
        }

        #timer {
            font-size: 2rem;
            color: #ff4d4d;
        }

        .hidden { display: none; }

        h1 { color: #f39237; }

        /* Fuegos artificiales sencillos */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px red;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Nivel 1</h1>
        <p id="instruction">¡Cuenta cuántos logos aparecen!</p>
        <div id="timer">5</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion">Empezar Juego</button>
    </div>

    <div id="game-container"></div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const titleDisplay = document.getElementById('title');
        
        // Reemplaza esta URL con la ruta local de tu imagen si lo deseas
        const logoURL = "logodgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timeLeft = 5;
        let timerInterval;

        function startGame() {
            startBtn.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) {
                victory();
                return;
            }

            titleDisplay.innerText = `Nivel ${currentLevel}`;
            optionsContainer.classList.add('hidden');
            gameContainer.innerHTML = '';
            timerDisplay.classList.remove('hidden');
            
            // Lógica de dificultad: Nivel 1 (3-6 logos), aumenta con el nivel
            correctCount = Math.floor(Math.random() * 5) + (currentLevel * 3);
            
            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                // Posiciones aleatorias
                img.style.left = Math.random() * 85 + 'vw';
                img.style.top = Math.random() * 70 + 'vh';
                // Rotación aleatoria para más dificultad
                img.style.transform = `rotate(${Math.random() * 360}deg)`;
                gameContainer.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            timerDisplay.innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            gameContainer.innerHTML = ''; // Limpiar logos
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            // Crear 3 opciones separadas por una unidad
            const choices = [correctCount - 1, correctCount, correctCount + 1];
            // Barajar opciones
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.innerText = num;
                btn.onclick = () => checkAnswer(num);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === correctCount) {
                currentLevel++;
                nextLevel();
            } else {
                alert("¡Incorrecto! Volvemos al nivel 1.");
                currentLevel = 1;
                nextLevel();
            }
        }

        function victory() {
            titleDisplay.innerText = "¡ENHORABUENA!";
            document.getElementById('instruction').innerText = "Has superado todos los niveles de d'genes";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Jugar de nuevo</button>';
            
            // Efecto de fuegos artificiales
            setInterval(createFirework, 300);
        }

        function createFirework() {
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            fw.style.boxShadow = `0 0 20px 5px h豐富l(${Math.random() * 360}, 100%, 50%)`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
