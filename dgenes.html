<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío d'genes</title>
    <style>
        :root {
            --orange: #f39237;
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            /* Soporte para áreas seguras de iPhone/Android */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
        }

        /* Panel superior: Ajustado para que no crezca demasiado */
        #ui-layer {
            flex-shrink: 0;
            padding: 10px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 { color: var(--orange); margin: 5px 0; font-size: 1.4rem; }
        #instruction { font-size: 0.9rem; color: #bbb; margin-bottom: 5px; }

        #timer {
            font-size: 3rem;
            color: var(--red);
            font-weight: bold;
            line-height: 1;
        }

        /* Área de juego: Ocupa todo el espacio restante */
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            width: 65px; /* Tamaño optimizado para móvil */
            pointer-events: none;
            user-select: none;
        }

        .btn-opcion {
            background-color: var(--orange);
            border: none;
            color: white;
            padding: 12px 24px;
            margin: 8px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b36b29;
        }

        .btn-opcion:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b36b29;
        }

        .hidden { display: none !important; }

        /* Pantalla de Error */
        #error-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 20;
        }

        .error-text { color: var(--red); font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }

        /* Fuegos artificiales */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Desafío d'genes</h1>
        <p id="instruction">Presiona el botón para empezar</p>
        
        <div id="timer" class="hidden">10</div>
        
        <div id="options-container" class="hidden"></div>
        
        <button id="start-btn" class="btn-opcion">Empezar Juego</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <div class="error-text">¡Nivel Fallido!</div>
            <p id="error-info" style="margin-bottom: 20px;"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar Nivel 1</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const titleDisplay = document.getElementById('title');
        const instructionDisplay = document.getElementById('instruction');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        const logoURL = "logodgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timeLeft = 10;
        let timerInterval;

        function startGame() {
            startBtn.classList.add('hidden');
            errorScreen.classList.add('hidden');
            currentLevel = 1;
            nextLevel();
        }

        function resetGame() {
            errorScreen.classList.add('hidden');
            currentLevel = 1;
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) {
                victory();
                return;
            }

            titleDisplay.innerText = `Nivel ${currentLevel} / 10`;
            instructionDisplay.innerText = "¡Cuenta rápido!";
            optionsContainer.classList.add('hidden');
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.remove('hidden');
            
            // Dificultad: escala de 4 a 25 aprox.
            correctCount = Math.floor(Math.random() * 3) + (currentLevel * 2 + 2);
            
            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                // Posición relativa al área de juego (dejando margen)
                img.style.left = (Math.random() * 75 + 5) + '%';
                img.style.top = (Math.random() * 75 + 5) + '%';
                img.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.add('hidden');
            instructionDisplay.innerText = "¿Cuántos logos contaste?";
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if(num >= 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => checkAnswer(num);
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function checkAnswer(selected) {
            if (selected === correctCount) {
                currentLevel++;
                nextLevel();
            } else {
                showError();
            }
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            instructionDisplay.innerText = "Fin de la partida";
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = `La respuesta correcta era ${correctCount}.`;
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
        }

        function victory() {
            titleDisplay.innerText = "¡LO LOGRASTE!";
            instructionDisplay.innerText = "Eres un experto de d'genes";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Reiniciar Todo</button>';
            optionsContainer.classList.remove('hidden');
            setInterval(createFirework, 250);
        }

        function createFirework() {
            const colors = ['#f39237', '#ff4d4d', '#ffffff', '#2ecc71'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            fw.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            fw.style.boxShadow = `0 0 20px 5px ${fw.style.backgroundColor}`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
