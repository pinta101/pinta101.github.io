<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafío d'genes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #ui-layer {
            height: 30vh; /* Ocupa la parte superior */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(to bottom, #000 80%, transparent);
        }

        #game-area {
            position: relative;
            flex-grow: 1; /* El resto de la pantalla */
            width: 100vw;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            width: 70px; /* Un poco más pequeño para móviles */
            pointer-events: none;
        }

        .btn-opcion {
            background-color: #f39237; 
            border: none;
            color: white;
            padding: 12px 25px;
            margin: 8px;
            font-size: 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        #timer {
            font-size: 3.5rem;
            color: #ff4d4d;
            font-weight: bold;
        }

        .hidden { display: none; }
        h1 { color: #f39237; font-size: 1.5rem; margin: 5px; }
        p { margin: 5px; font-size: 0.9rem; }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(25); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Nivel 1</h1>
        <p id="instruction">¿Cuántos logos hay?</p>
        <div id="timer" class="hidden">10</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion">Empezar</button>
    </div>

    <div id="game-area"></div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const titleDisplay = document.getElementById('title');
        const instructionDisplay = document.getElementById('instruction');
        
        const logoURL = "logodgenes.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timeLeft = 10;
        let timerInterval;

        function startGame() {
            startBtn.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) {
                victory();
                return;
            }

            titleDisplay.innerText = `Nivel ${currentLevel} / 10`;
            optionsContainer.classList.add('hidden');
            gameArea.innerHTML = '';
            timerDisplay.classList.remove('hidden');
            
            correctCount = Math.floor(Math.random() * 4) + (currentLevel * 2 + 1);
            
            // Calculamos límites para que no se salgan ni se tapen
            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // USAMOS PORCENTAJES SEGUROS (del 5% al 85% para evitar bordes)
                const posX = Math.random() * 80 + 5; 
                const posY = Math.random() * 70 + 5; 

                img.style.left = posX + '%';
                img.style.top = posY + '%';
                img.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
                
                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            gameArea.innerHTML = ''; 
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if(num >= 0) { // Evitar números negativos si el nivel es muy bajo
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => checkAnswer(num);
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function checkAnswer(selected) {
            if (selected === correctCount) {
                currentLevel++;
                nextLevel();
            } else {
                alert(`¡Error! Había ${correctCount}. Reiniciando...`);
                currentLevel = 1;
                nextLevel();
            }
        }

        function victory() {
            titleDisplay.innerText = "¡GANASTE!";
            instructionDisplay.innerText = "¡Increíble vista!";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Otra vez</button>';
            setInterval(createFirework, 300);
        }

        function createFirework() {
            const colors = ['#f39237', '#ff4d4d', '#00ff00', '#2980b9'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            fw.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            fw.style.boxShadow = `0 0 20px 5px ${fw.style.backgroundColor}`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
