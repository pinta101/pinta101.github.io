<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío Totana - Logos Compactos</title>
    <style>
        :root {
            --totana-blue: #0076c8;
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            /* Protecciones mínimas para cámara/barra de sistema */
            padding: env(safe-area-inset-top) 5px env(safe-area-inset-bottom) 5px;
        }

        /* Panel superior fijo y minimizado */
        #ui-layer {
            flex-shrink: 0;
            text-align: center;
            padding: 5px 0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        h1 { color: var(--totana-blue); margin: 0; font-size: 1.2rem; }
        #instruction { font-size: 0.85rem; color: #999; margin: 2px 0; }

        #timer {
            font-size: 3.5rem;
            color: var(--red);
            font-weight: bold;
            line-height: 1;
        }

        /* Área de juego expandida y limpia */
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden;
            margin: 0; 
        }

        .logo {
            position: absolute;
            /* --- LOGO MÁS PEQUEÑO: Reducido de 140px a 112px (-20%) --- */
            width: 112px; 
            height: auto;
            pointer-events: none;
            user-select: none;
            /* Contraste: Borde blanco limpio */
            filter: drop-shadow(0 0 2px #fff);
        }

        /* ANIMACIÓN DE PARPADEO LENTO (MANTENIDA) */
        @keyframes flash-animation {
            0% { opacity: 1; }
            50% { opacity: 0.15; }
            100% { opacity: 1; }
        }

        /* Botones de respuesta y acción */
        .btn-opcion {
            background-color: var(--totana-blue);
            border: none;
            color: white;
            padding: 12px 25px;
            margin: 5px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #005696;
            transition: transform 0.1s;
        }

        .btn-opcion:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #005696;
        }

        .hidden { display: none !important; }

        /* Pantalla de fallo estrecha y centrada */
        #error-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; 
            max-width: 300px;
            text-align: center;
            background: rgba(20, 20, 20, 0.98);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--red);
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.2);
        }

        .error-title { color: var(--red); font-size: 1.3rem; margin: 0 0 10px 0; }
        .error-info { font-size: 0.9rem; color: #ddd; margin-bottom: 15px; }

        /* Fuegos artificiales de victoria */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Ayuntamiento de Totana</h1>
        <p id="instruction">Cuenta los logotipos</p>
        <div id="timer" class="hidden">20</div>
        
        <div id="options-container" class="hidden"></div>
        
        <button id="start-btn" class="btn-opcion" onclick="startGame()">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 class="error-title">¡Incorrecto!</h2>
            <p id="error-info" class="error-info"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const titleDisplay = document.getElementById('title');
        const instructionDisplay = document.getElementById('instruction');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        // --- NOMBRE DE IMAGEN CORRECTO ---
        const logoURL = "aytototana.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timeLeft = 20; 
        let timerInterval;

        function clearLogos() {
            const currentLogos = gameArea.querySelectorAll('.logo');
            currentLogos.forEach(l => l.remove());
        }

        function startGame() {
            startBtn.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            errorScreen.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { victory(); return; }

            titleDisplay.innerText = `Nivel ${currentLevel} / 10`;
            optionsContainer.classList.add('hidden');
            clearLogos();
            timerDisplay.classList.remove('hidden');
            
            // Cantidad progresiva de logos (entre 3 y 20 aprox)
            correctCount = Math.floor(Math.random() * 3) + (currentLevel * 1.5 + 2);
            correctCount = Math.floor(correctCount); // Asegurar entero
            
            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // --- AJUSTE DE ÁREA DE JUEGO (MÁXIMA Y SEGURA, CON MARGEN INFERIOR AÑADIDO) ---
                // Compensación de ancho: 112px. Mitad: 56px.
                const posX = Math.random() * 55 + 20; 
                // --- MARGEN INFERIOR AÑADIDO: El rango de posY es [10%, 60%]. Se añade la compensación calc. ---
                // El margen inferior efectivo es de 40px, asegurando que no toque los botones.
                const posY = Math.random() * 50 + 10; 

                img.style.left = `calc(${posX}% - 56px)`; 
                img.style.top = `calc(${posY}% - 40px)`; 
                img.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;

                // PARPADEO LENTO MEJORADO (MANTENIDO, 1.5s - 2.5s)
                const speed = (Math.random() * 1.0 + 1.5).toFixed(2);
                img.style.animation = `flash-animation ${speed}s infinite ease-in-out`;
                // Retraso aleatorio para que no parpadeen todos a la vez
                img.style.animationDelay = `${Math.random() * 2}s`;

                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            timeLeft = 20;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            clearLogos(); // Borramos logos para que no distraigan
            timerDisplay.classList.add('hidden');
            instructionDisplay.innerText = "¿Cuántos has contado?";
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            // Generamos las 3 opciones (Correcta, Correcta - 1, Correcta + 1)
            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5); // Barajamos

            choices.forEach(num => {
                if(num >= 0) { // No mostramos negativos
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => {
                        if (num === correctCount) {
                            currentLevel++;
                            nextLevel();
                        } else {
                            showError();
                        }
                    };
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = `La respuesta era ${correctCount}.`;
        }

        function victory() {
            titleDisplay.innerText = "¡VICTORIA!";
            instructionDisplay.innerText = "¡Enhorabuena, experto!";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Reiniciar Todo</button>';
            optionsContainer.classList.remove('hidden');
            timerDisplay.classList.add('hidden');
            
            // Lanzar fuegos artificiales infinitos
            setInterval(createFirework, 200);
        }

        function createFirework() {
            const colors = [var(--totana-blue), '#ff4d4d', '#ffffff', '#00f2ff', '#2ecc71'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            // Aparecen en cualquier punto de la pantalla
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            const color = colors[Math.floor(Math.random() * colors.length)];
            fw.style.backgroundColor = color;
            fw.style.boxShadow = `0 0 20px 5px ${color}`;
            document.body.appendChild(fw);
            // Se borran después de la animación para no saturar
            setTimeout(() => fw.remove(), 1000);
        }
    </script>
</body>
</html>
