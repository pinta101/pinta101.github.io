<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío Totana</title>
    <style>
        :root {
            --totana-blue: #0076c8;
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #ui-layer {
            flex-shrink: 0;
            text-align: center;
            padding: 10px 0;
            min-height: 100px;
            z-index: 10;
        }

        h1 { color: var(--totana-blue); margin: 0; font-size: 1.2rem; }
        #timer { font-size: 3.5rem; color: var(--red); font-weight: bold; }
        
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            /* LOGO MÁS PEQUEÑO */
            width: 90px; 
            height: auto;
            pointer-events: none;
        }

        @keyframes flash-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        .btn-opcion {
            background-color: var(--totana-blue);
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #005696;
        }

        .hidden { display: none !important; }

        #error-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            text-align: center;
            background: #111;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid var(--red);
            z-index: 30;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Ayuntamiento de Totana</h1>
        <div id="timer" class="hidden">20</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion" onclick="startGame()">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 style="color: var(--red);">¡Fallaste!</h2>
            <p id="error-info"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        // NOMBRE DE IMAGEN CORRECTO
        const logoURL = "aytototana.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let timerInterval;

        function startGame() {
            startBtn.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            errorScreen.classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { victory(); return; }

            document.getElementById('title').innerText = `Nivel ${currentLevel} / 10`;
            optionsContainer.classList.add('hidden');
            gameArea.innerHTML = ''; // Limpiar logos
            // Volver a meter el error-screen que borramos con innerHTML
            gameArea.appendChild(errorScreen); 
            
            timerDisplay.classList.remove('hidden');
            
            correctCount = Math.floor(Math.random() * 3) + (currentLevel + 2);

            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // MARGENES SEGUROS (Evita que se corten por los lados y por abajo)
                const posX = Math.random() * 60 + 20; // 20% a 80%
                const posY = Math.random() * 50 + 10; // 10% a 60% (Deja mucho margen abajo)

                img.style.left = `calc(${posX}% - 45px)`; 
                img.style.top = posY + '%';
                img.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;

                // PARPADEO LENTO (1.5s a 2.5s)
                const speed = (Math.random() * 1.0 + 1.5).toFixed(2);
                img.style.animation = `flash-animation ${speed}s infinite ease-in-out`;
                img.style.animationDelay = `${Math.random() * 2}s`;

                gameArea.appendChild(img);
            }

            startTimer();
        }

        function startTimer() {
            let timeLeft = 20;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            // Limpiar logos
            gameArea.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                if(num >= 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcion';
                    btn.innerText = num;
                    btn.onclick = () => {
                        if (num === correctCount) {
                            currentLevel++;
                            nextLevel();
                        } else {
                            showError();
                        }
                    };
                    optionsContainer.appendChild(btn);
                }
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = `La respuesta correcta era ${correctCount}.`;
        }

        function victory() {
            document.getElementById('title').innerText = "¡VICTORIA!";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="location.reload()">Jugar de nuevo</button>';
            optionsContainer.classList.remove('hidden');
            timerDisplay.classList.add('hidden');
            setInterval(createFirework, 200);
        }

        function createFirework() {
            const colors = ['#0076c8', '#ff4d4d', '#ffffff', '#00f2ff', '#2ecc71'];
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            const color = colors[Math.floor(Math.random() * colors.length)];
            fw.style.backgroundColor = color;
            fw.style.boxShadow = `0 0 20px 5px ${color}`;
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }
    </script>
</body>
</html>
