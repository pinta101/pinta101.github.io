<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pelotea el Escudo!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --azul: #0057A8;
    --azul-claro: #1a7fd4;
    --azul-oscuro: #003d7a;
    --dorado: #c9a227;
    --dorado-claro: #f0c040;
    --blanco: #f8f4ee;
    --fondo: #001f4d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fondo);
    font-family: 'Cinzel', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(0,87,168,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(201,162,39,0.1) 0%, transparent 50%);
    pointer-events: none;
  }

  h1 {
    color: var(--dorado);
    font-size: clamp(1rem, 3vw, 1.6rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(201,162,39,0.5);
    font-weight: 900;
  }

  #stats {
    display: flex;
    gap: 40px;
    color: var(--blanco);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
  }

  #stats span { 
    color: var(--dorado-claro); 
    font-size: 1.1rem;
    font-weight: 700;
  }

  #gameCanvas {
    border: 2px solid var(--azul-claro);
    border-radius: 4px;
    box-shadow: 
      0 0 30px rgba(0,87,168,0.6),
      0 0 60px rgba(0,87,168,0.2),
      inset 0 0 30px rgba(0,0,0,0.3);
    display: block;
    cursor: none;
  }

  #controls {
    margin-top: 10px;
    color: rgba(248,244,238,0.5);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    font-family: 'Crimson Text', serif;
  }
</style>
</head>
<body>

<h1>⚜ Pelotea el Escudo ⚜</h1>

<div id="stats">
  <div>PUNTOS: <span id="scoreDisplay">0</span></div>
  <div>RÉCORD: <span id="highDisplay">0</span></div>
  <div>VIDAS: <span id="livesDisplay">3</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">RATÓN / TÁCTIL para mover la pala · CLIC para comenzar</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Offscreen canvas for crisp shield ---
const offscreen = document.createElement('canvas');
const offCtx = offscreen.getContext('2d');

function resize() {
  const maxW = Math.min(window.innerWidth - 40, 600);
  const maxH = Math.min(window.innerHeight - 180, 500);
  canvas.width = maxW;
  canvas.height = maxH;
}
resize();
window.addEventListener('resize', () => { resize(); resetGame(); });

// Load real Murcia shield from Wikipedia (high quality SVG-based PNG)
const shieldImg = new Image();
shieldImg.crossOrigin = 'anonymous';

// Fallback: draw a proper Murcia-style shield on canvas if image fails
let shieldLoaded = false;
let useDrawnShield = false;

function drawMurciaShield(targetCtx, cx, cy, r) {
  // Shield shape
  const s = r * 0.85;
  targetCtx.save();
  targetCtx.translate(cx, cy);

  // Shield outline path
  targetCtx.beginPath();
  targetCtx.moveTo(-s, -s);
  targetCtx.lineTo(s, -s);
  targetCtx.lineTo(s, s * 0.4);
  targetCtx.quadraticCurveTo(s, s * 1.1, 0, s * 1.3);
  targetCtx.quadraticCurveTo(-s, s * 1.1, -s, s * 0.4);
  targetCtx.closePath();

  // Gold border
  targetCtx.strokeStyle = '#c9a227';
  targetCtx.lineWidth = r * 0.08;
  targetCtx.stroke();

  // Top half - red (Castilla)
  targetCtx.save();
  targetCtx.clip();
  
  // Background: quartered
  // Top-left: gules (red) with castle
  targetCtx.fillStyle = '#CC0000';
  targetCtx.fillRect(-s, -s, s, s * 0.7);
  
  // Top-right: argent (white) with lion
  targetCtx.fillStyle = '#F5F0E8';
  targetCtx.fillRect(0, -s, s, s * 0.7);
  
  // Bottom-left: white
  targetCtx.fillStyle = '#F5F0E8';
  targetCtx.fillRect(-s, -s * 0.3, s, s * 1.6);
  
  // Bottom-right: red
  targetCtx.fillStyle = '#CC0000';
  targetCtx.fillRect(0, -s * 0.3, s, s * 1.6);

  // Castle icon (top-left)
  const castleX = -s * 0.5, castleY = -s * 0.5;
  const cs = s * 0.35;
  targetCtx.fillStyle = '#F5D060';
  targetCtx.fillRect(castleX - cs*0.4, castleY - cs*0.1, cs*0.8, cs*0.6);
  targetCtx.fillRect(castleX - cs*0.5, castleY - cs*0.4, cs*0.25, cs*0.35);
  targetCtx.fillRect(castleX - cs*0.12, castleY - cs*0.4, cs*0.25, cs*0.35);
  targetCtx.fillRect(castleX + cs*0.25, castleY - cs*0.4, cs*0.25, cs*0.35);
  // Castle door
  targetCtx.fillStyle = '#333';
  targetCtx.beginPath();
  targetCtx.arc(castleX, castleY + cs*0.2, cs*0.12, Math.PI, 0);
  targetCtx.fillRect(castleX - cs*0.12, castleY + cs*0.15, cs*0.24, cs*0.25);
  targetCtx.fill();

  // Lion (top-right) - simplified
  const lionX = s * 0.5, lionY = -s * 0.45;
  const ls = s * 0.32;
  targetCtx.fillStyle = '#9B1111';
  // Body
  targetCtx.beginPath();
  targetCtx.ellipse(lionX, lionY + ls*0.2, ls*0.35, ls*0.25, 0, 0, Math.PI*2);
  targetCtx.fill();
  // Head
  targetCtx.beginPath();
  targetCtx.arc(lionX + ls*0.3, lionY - ls*0.1, ls*0.22, 0, Math.PI*2);
  targetCtx.fill();
  // Mane
  targetCtx.beginPath();
  targetCtx.arc(lionX + ls*0.3, lionY - ls*0.1, ls*0.28, 0, Math.PI*2);
  targetCtx.fillStyle = '#6B0000';
  targetCtx.fill();
  targetCtx.fillStyle = '#9B1111';
  targetCtx.beginPath();
  targetCtx.arc(lionX + ls*0.3, lionY - ls*0.1, ls*0.18, 0, Math.PI*2);
  targetCtx.fill();
  // Tail
  targetCtx.beginPath();
  targetCtx.strokeStyle = '#9B1111';
  targetCtx.lineWidth = ls * 0.08;
  targetCtx.moveTo(lionX - ls*0.35, lionY + ls*0.1);
  targetCtx.quadraticCurveTo(lionX - ls*0.6, lionY - ls*0.3, lionX - ls*0.45, lionY - ls*0.55);
  targetCtx.stroke();

  // Dividing lines
  targetCtx.strokeStyle = '#c9a227';
  targetCtx.lineWidth = r * 0.04;
  targetCtx.beginPath();
  targetCtx.moveTo(0, -s);
  targetCtx.lineTo(0, s * 1.3);
  targetCtx.stroke();
  targetCtx.beginPath();
  targetCtx.moveTo(-s, -s * 0.3);
  targetCtx.lineTo(s, -s * 0.3);
  targetCtx.stroke();

  // Crown at top center
  const crownY = -s * 1.05;
  const cw = s * 0.55;
  targetCtx.fillStyle = '#c9a227';
  // Crown base
  targetCtx.fillRect(-cw/2, crownY + s*0.12, cw, s*0.15);
  // Crown points
  for (let i = 0; i < 5; i++) {
    const px = -cw/2 + (i / 4) * cw;
    const ph = (i % 2 === 0) ? s * 0.18 : s * 0.1;
    targetCtx.fillRect(px - s*0.04, crownY - ph + s*0.12, s*0.08, ph);
    // Jewels on tall points
    if (i % 2 === 0) {
      targetCtx.beginPath();
      targetCtx.arc(px, crownY - ph + s*0.1, s*0.05, 0, Math.PI*2);
      targetCtx.fillStyle = i === 2 ? '#CC0000' : '#0057A8';
      targetCtx.fill();
      targetCtx.fillStyle = '#c9a227';
    }
  }

  targetCtx.restore();

  // Re-stroke border on top
  targetCtx.beginPath();
  targetCtx.moveTo(-s, -s);
  targetCtx.lineTo(s, -s);
  targetCtx.lineTo(s, s * 0.4);
  targetCtx.quadraticCurveTo(s, s * 1.1, 0, s * 1.3);
  targetCtx.quadraticCurveTo(-s, s * 1.1, -s, s * 0.4);
  targetCtx.closePath();
  targetCtx.strokeStyle = '#c9a227';
  targetCtx.lineWidth = r * 0.07;
  targetCtx.stroke();

  targetCtx.restore();
}

// Try to load real shield image
shieldImg.onload = () => { 
  shieldLoaded = true; 
  useDrawnShield = false;
  prepareOffscreen();
};
shieldImg.onerror = () => { 
  useDrawnShield = true; 
  shieldLoaded = true;
  prepareOffscreen();
};

function prepareOffscreen() {
  // Pre-render shield at high resolution for crisp display
  const size = 256;
  offscreen.width = size;
  offscreen.height = size;
  offCtx.clearRect(0, 0, size, size);

  if (useDrawnShield) {
    drawMurciaShield(offCtx, size/2, size/2, size * 0.42);
  } else {
    offCtx.drawImage(shieldImg, 0, 0, size, size);
  }
}

// Try loading from a reliable source
shieldImg.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Escudo_de_Murcia.svg/200px-Escudo_de_Murcia.svg.png';

// Fallback timeout
setTimeout(() => {
  if (!shieldLoaded) {
    useDrawnShield = true;
    shieldLoaded = true;
    prepareOffscreen();
    if (state === 'idle') drawIdle();
  }
}, 2000);

// Game state
let state = 'idle';
let score = 0, highScore = 0, lives = 3;
let ballX, ballY, ballVX, ballVY, ballR;
let paddleX, paddleW, paddleH, paddleY;
let particles = [];
let combo = 0;
let shake = 0;

// Speed multiplier — starts faster!
const BASE_SPEED_FACTOR = 0.013; // was 0.007
const SPEED_INCREMENT = 1.022;   // slightly more acceleration per bounce

function resetGame() {
  ballR = Math.max(26, canvas.width * 0.062);
  paddleW = Math.max(80, canvas.width * 0.22);
  paddleH = 14;
  paddleY = canvas.height - 40;
  paddleX = canvas.width / 2 - paddleW / 2;
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  const speed = canvas.width * BASE_SPEED_FACTOR;
  const angle = -Math.PI/2 + (Math.random()-0.5) * 0.8;
  ballVX = Math.cos(angle) * speed;
  ballVY = Math.sin(angle) * speed;
  particles = [];
  combo = 0;
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  paddleX = e.clientX - r.left - paddleW/2;
  clampPaddle();
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  paddleX = e.touches[0].clientX - r.left - paddleW/2;
  clampPaddle();
}, {passive:false});
canvas.addEventListener('click', startOrRestart);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startOrRestart(); }, {passive:false});

function clampPaddle() {
  paddleX = Math.max(0, Math.min(canvas.width - paddleW, paddleX));
}

function startOrRestart() {
  if (state === 'idle' || state === 'gameover') {
    score = 0; lives = 3;
    resetGame();
    state = 'playing';
  } else if (state === 'dead') {
    resetGame();
    state = 'playing';
  }
}

function spawnParticles(x, y, color, count=8) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2;
    const s = 1.5+Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      life: 1,
      decay: 0.022+Math.random()*0.028,
      r: 2+Math.random()*5,
      color
    });
  }
}

function update() {
  if (state !== 'playing') return;

  if (shake > 0) shake -= 0.5;

  ballX += ballVX;
  ballY += ballVY;

  if (ballX - ballR < 0) { ballX = ballR; ballVX = Math.abs(ballVX); spawnParticles(0, ballY, '#4af'); }
  if (ballX + ballR > canvas.width) { ballX = canvas.width-ballR; ballVX = -Math.abs(ballVX); spawnParticles(canvas.width, ballY, '#4af'); }
  if (ballY - ballR < 0) { ballY = ballR; ballVY = Math.abs(ballVY); spawnParticles(ballX, 0, '#4af'); }

  if (
    ballY + ballR >= paddleY &&
    ballY + ballR <= paddleY + paddleH + Math.abs(ballVY) &&
    ballX >= paddleX - ballR/2 &&
    ballX <= paddleX + paddleW + ballR/2 &&
    ballVY > 0
  ) {
    const hit = (ballX - paddleX) / paddleW;
    const angle = (hit - 0.5) * Math.PI * 0.75;
    const speed = Math.hypot(ballVX, ballVY) * SPEED_INCREMENT;
    ballVX = Math.sin(angle) * speed;
    ballVY = -Math.abs(Math.cos(angle) * speed);
    ballY = paddleY - ballR;
    
    score++;
    combo++;
    if (combo > 1) score += combo - 1;
    if (score > highScore) highScore = score;
    
    shake = 6;
    const col = combo >= 5 ? '#f0c040' : '#4af';
    spawnParticles(ballX, paddleY, col, combo >= 5 ? 18 : 8);
  }

  if (ballY - ballR > canvas.height) {
    lives--;
    combo = 0;
    spawnParticles(ballX, canvas.height, '#f44', 25);
    state = lives <= 0 ? 'gameover' : 'dead';
  }

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.life -= p.decay;
  });
}

function drawBall() {
  ctx.save();
  ctx.translate(ballX, ballY);
  
  // Outer glow
  const grd = ctx.createRadialGradient(0, 0, ballR*0.3, 0, 0, ballR*1.8);
  grd.addColorStop(0, 'rgba(0,120,255,0.35)');
  grd.addColorStop(1, 'rgba(0,120,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, ballR*1.8, 0, Math.PI*2);
  ctx.fill();

  // Ball base circle
  const grad = ctx.createRadialGradient(-ballR*0.25, -ballR*0.25, ballR*0.05, 0, 0, ballR);
  grad.addColorStop(0, '#dceeff');
  grad.addColorStop(0.35, '#90c8f8');
  grad.addColorStop(1, '#0a4a8a');
  ctx.beginPath();
  ctx.arc(0, 0, ballR, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // White rim
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Shield image clipped inside ball
  if (shieldLoaded && offscreen.width > 0) {
    ctx.save();
    ctx.beginPath();
    // Slightly smaller clip to show the gradient border
    ctx.arc(0, 0, ballR - 4, 0, Math.PI*2);
    ctx.clip();
    // Draw offscreen shield centered, filling the ball
    const d = (ballR - 4) * 2;
    ctx.drawImage(offscreen, -d/2, -d/2, d, d);
    ctx.restore();
  }

  // Shine highlight (on top of everything)
  const shine = ctx.createRadialGradient(-ballR*0.28, -ballR*0.32, 0, -ballR*0.28, -ballR*0.32, ballR*0.45);
  shine.addColorStop(0, 'rgba(255,255,255,0.45)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, ballR, 0, Math.PI*2);
  ctx.fillStyle = shine;
  ctx.fill();

  ctx.restore();
}

function drawPaddle() {
  ctx.save();
  
  ctx.shadowColor = 'rgba(0,150,255,0.7)';
  ctx.shadowBlur = 18;

  const pg = ctx.createLinearGradient(paddleX, paddleY, paddleX, paddleY+paddleH);
  pg.addColorStop(0, '#6cd4ff');
  pg.addColorStop(0.5, '#0077cc');
  pg.addColorStop(1, '#004a8f');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.roundRect(paddleX, paddleY, paddleW, paddleH, paddleH/2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath();
  ctx.roundRect(paddleX+4, paddleY+2, paddleW-8, 3, 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function drawBg() {
  ctx.fillStyle = 'rgba(0,15,40,0.95)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(0,60,120,0.2)';
  ctx.lineWidth = 1;
  const gs = 40;
  for (let x=0; x<canvas.width; x+=gs) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for (let y=0; y<canvas.height; y+=gs) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
}

function drawCombo() {
  if (combo >= 3) {
    ctx.save();
    ctx.font = `bold ${Math.min(28, canvas.width*0.05)}px Cinzel, serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0c040';
    ctx.shadowColor = '#f0c040';
    ctx.shadowBlur = 20;
    ctx.globalAlpha = 0.85;
    ctx.fillText(`COMBO x${combo}!`, canvas.width/2, 40);
    ctx.restore();
  }
}

function drawOverlay(title, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,10,30,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c9a227';
  ctx.shadowColor = '#c9a227';
  ctx.shadowBlur = 30;
  ctx.font = `bold ${Math.min(48, canvas.width*0.1)}px Cinzel, serif`;
  ctx.fillText(title, canvas.width/2, canvas.height/2 - 20);
  
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f8f4ee';
  ctx.font = `italic ${Math.min(16, canvas.width*0.035)}px Crimson Text, serif`;
  ctx.fillText(sub, canvas.width/2, canvas.height/2 + 20);
  ctx.restore();
}

function drawIdle() {
  drawBg();
  // Draw shield preview in center
  if (shieldLoaded) {
    const r = Math.max(40, canvas.width * 0.1);
    ctx.save();
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2 - 30, r, 0, Math.PI*2);
    ctx.clip();
    if (offscreen.width > 0) {
      ctx.drawImage(offscreen, canvas.width/2 - r, canvas.height/2 - 30 - r, r*2, r*2);
    }
    ctx.restore();
  }
  drawOverlay('⚜ COMENZAR ⚜', 'Clic o toca para jugar');
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  
  drawBg();
  drawParticles();
  
  if (state === 'playing') {
    drawBall();
    drawPaddle();
    drawCombo();
  } else if (state === 'dead') {
    drawBall();
    drawPaddle();
    drawOverlay('¡FUERA!', `Vidas: ${lives} · Clic para continuar`);
  } else if (state === 'gameover') {
    drawOverlay('⚜ GAME OVER ⚜', `Puntuación: ${score} · Clic para reintentar`);
  } else {
    drawIdle();
  }
  
  ctx.restore();
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('highDisplay').textContent = highScore;
  document.getElementById('livesDisplay').textContent = '❤'.repeat(Math.max(0,lives));
}

function loop() {
  update();
  draw();
  updateUI();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
