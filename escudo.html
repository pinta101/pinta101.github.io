<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Escudo de Murcia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    touch-action: none;
    user-select: none;
  }

  #hint {
    color: rgba(0, 120, 200, 0.7);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 30px;
    transition: opacity 0.5s;
  }

  #canvas-container {
    position: relative;
    width: 220px;
    height: 280px;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
  }

  #status {
    margin-top: 30px;
    color: rgba(0, 120, 200, 0.5);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: opacity 0.5s;
  }

  /* Desktop shake button */
  #shake-btn {
    margin-top: 24px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid rgba(0,120,200,0.4);
    color: rgba(0,120,200,0.7);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }
  #shake-btn:hover {
    background: rgba(0,120,200,0.1);
    border-color: rgba(0,120,200,0.8);
    color: rgba(0,160,255,1);
  }
  @media (pointer: coarse) {
    #shake-btn { display: none; }
  }
</style>
</head>
<body>

<div id="hint">agita el móvil</div>
<div id="canvas-container">
  <canvas id="imgCanvas" width="220" height="280"></canvas>
  <canvas id="shatterCanvas" width="220" height="280"></canvas>
</div>
<div id="status">listo</div>
<button id="shake-btn" onclick="triggerShake()">AGITAR</button>

const NUM_FRAGMENTS = 55;
const SHAKE_THRESHOLD = 18;
const CALM_THRESHOLD = 3;
const CALM_DURATION = 600; // ms of calm before reassembling

// ─── STATE ────────────────────────────────────────────────────────────────────
let fragments = [];
let isShattered = false;
let isReassembling = false;
let isExploding = false;
let calmTimer = null;
let animFrame = null;
let imgReady = false;
let shieldImage = new Image();

const imgCanvas = document.getElementById('imgCanvas');
const shatterCanvas = document.getElementById('shatterCanvas');
const ctx = imgCanvas.getContext('2d');
const sctx = shatterCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');

// ─── LOAD IMAGE ───────────────────────────────────────────────────────────────
shieldImage.onload = () => {
  imgReady = true;
  drawOriginal();
  buildFragments();
};
shieldImage.src = IMG_SRC;

function drawOriginal() {
  ctx.clearRect(0, 0, 220, 280);
  ctx.drawImage(shieldImage, 0, 0, 220, 280);
}

// ─── VORONOI-LIKE FRAGMENTS ───────────────────────────────────────────────────
function buildFragments() {
  // Generate random seed points
  const seeds = [];
  for (let i = 0; i < NUM_FRAGMENTS; i++) {
    seeds.push({
      x: 10 + Math.random() * 200,
      y: 10 + Math.random() * 260
    });
  }

  // For each seed, compute a clipped polygon (approximated by sampling)
  const W = 220, H = 280;
  const GRID = 3; // pixel sample step
  const cellPixels = new Array(NUM_FRAGMENTS).fill(null).map(() => []);

  // Assign each pixel to nearest seed
  for (let py = 0; py < H; py += GRID) {
    for (let px = 0; px < W; px += GRID) {
      let minD = Infinity, minI = 0;
      for (let i = 0; i < seeds.length; i++) {
        const dx = px - seeds[i].x, dy = py - seeds[i].y;
        const d = dx*dx + dy*dy;
        if (d < minD) { minD = d; minI = i; }
      }
      cellPixels[minI].push([px, py]);
    }
  }

  // Build fragment objects with bounding data + image snapshot
  fragments = [];
  for (let i = 0; i < NUM_FRAGMENTS; i++) {
    const pixels = cellPixels[i];
    if (pixels.length === 0) continue;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [px, py] of pixels) {
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px > maxX) maxX = px + GRID;
      if (py > maxY) maxY = py + GRID;
    }

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;

    // Convex hull of pixel centers for polygon clip
    const pts = pixels.map(([px, py]) => [px + GRID/2, py + GRID/2]);
    const hull = convexHull(pts);

    fragments.push({
      hull,               // polygon points (original coords)
      cx, cy,             // centroid
      // physics
      x: cx, y: cy,       // current position
      vx: 0, vy: 0,
      angle: 0,
      vAngle: 0,
      opacity: 1,
      scale: 1,
      // for reassembly
      targetX: cx, targetY: cy,
      targetAngle: 0,
      offsetX: 0, offsetY: 0,
    });
  }
}

function convexHull(points) {
  if (points.length < 3) return points;
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const lower = [], upper = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (const p of [...sorted].reverse()) {
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return [...lower, ...upper];
}
function cross(O, A, B) {
  return (A[0]-O[0])*(B[1]-O[1]) - (A[1]-O[1])*(B[0]-O[0]);
}

// ─── EXPLODE ──────────────────────────────────────────────────────────────────
function explode() {
  if (isExploding) return;
  isExploding = true;
  isReassembling = false;
  isShattered = false;
  cancelAnimationFrame(animFrame);

  if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
  statusEl.textContent = 'roto';
  statusEl.style.opacity = '1';

  // Hide original
  ctx.clearRect(0, 0, 220, 280);

  for (const f of fragments) {
    // launch from current pos
    const angle = Math.atan2(f.cy - 140, f.cx - 110);
    const speed = 4 + Math.random() * 10;
    f.vx = Math.cos(angle) * speed + (Math.random()-0.5)*4;
    f.vy = Math.sin(angle) * speed + (Math.random()-0.5)*4;
    f.vAngle = (Math.random() - 0.5) * 0.25;
    f.opacity = 1;
  }

  animateExplode();
}

function animateExplode() {
  sctx.clearRect(0, 0, 220, 280);

  let allGone = true;
  for (const f of fragments) {
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.18; // gravity
    f.vx *= 0.99;
    f.angle += f.vAngle;

    // fade once off canvas
    if (f.y > 320 || f.y < -60 || f.x < -80 || f.x > 300) {
      f.opacity = Math.max(0, f.opacity - 0.04);
    } else {
      allGone = false;
    }

    drawFragment(sctx, f);
  }

  if (!allGone) {
    animFrame = requestAnimationFrame(animateExplode);
  } else {
    isShattered = true;
    isExploding = false;
    statusEl.textContent = 'roto · para de agitar';
  }
}

// ─── REASSEMBLE ───────────────────────────────────────────────────────────────
function reassemble() {
  if (isReassembling || (!isShattered && !isExploding)) return;
  cancelAnimationFrame(animFrame);
  isExploding = false;
  isReassembling = true;
  isShattered = false;

  statusEl.textContent = 'reconstruyendo…';

  // Reset fragments to scattered positions if fully gone
  for (const f of fragments) {
    if (f.opacity <= 0) {
      // respawn off screen
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { f.x = -40; f.y = Math.random()*280; }
      else if (side === 1) { f.x = 260; f.y = Math.random()*280; }
      else if (side === 2) { f.x = Math.random()*220; f.y = -40; }
      else { f.x = Math.random()*220; f.y = 320; }
      f.opacity = 0.3;
      f.angle = Math.random() * Math.PI * 2;
    }
    f.vx = 0; f.vy = 0; f.vAngle = 0;
  }

  animateReassemble();
}

function animateReassemble() {
  sctx.clearRect(0, 0, 220, 280);

  let allHome = true;
  for (const f of fragments) {
    const dx = f.targetX - f.x;
    const dy = f.targetY - f.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    const speed = 0.08 + Math.min(dist * 0.015, 0.25);
    f.x += dx * speed;
    f.y += dy * speed;
    f.angle += (f.targetAngle - f.angle) * 0.1;
    f.opacity = Math.min(1, f.opacity + 0.025);

    if (dist > 0.5) allHome = false;

    drawFragment(sctx, f);
  }

  if (!allHome) {
    animFrame = requestAnimationFrame(animateReassemble);
  } else {
    // Snap all to home
    for (const f of fragments) {
      f.x = f.targetX; f.y = f.targetY;
      f.angle = 0; f.opacity = 1;
    }
    sctx.clearRect(0, 0, 220, 280);
    drawOriginal();
    isReassembling = false;
    statusEl.textContent = 'listo';
    hintEl.style.opacity = '1';
  }
}

// ─── DRAW FRAGMENT ────────────────────────────────────────────────────────────
function drawFragment(ctx2, f) {
  if (f.hull.length < 3 || f.opacity <= 0) return;
  ctx2.save();

  // Transform: translate to current pos, rotate, then clip & draw image
  const offX = f.x - f.cx;
  const offY = f.y - f.cy;

  ctx2.globalAlpha = f.opacity;
  ctx2.translate(f.x, f.y);
  ctx2.rotate(f.angle);
  ctx2.translate(-f.cx, -f.cy);

  // Clip to hull
  ctx2.beginPath();
  ctx2.moveTo(f.hull[0][0], f.hull[0][1]);
  for (let i = 1; i < f.hull.length; i++) ctx2.lineTo(f.hull[i][0], f.hull[i][1]);
  ctx2.closePath();
  ctx2.clip();

  // Draw original image at its position
  if (imgReady) ctx2.drawImage(shieldImage, 0, 0, 220, 280);

  // Subtle crack edge
  ctx2.strokeStyle = 'rgba(0,10,30,0.9)';
  ctx2.lineWidth = 1.2;
  ctx2.stroke();

  ctx2.restore();
}

// ─── SHAKE DETECTION ──────────────────────────────────────────────────────────
let lastAcc = { x: 0, y: 0, z: 0 };
let lastShakeTime = 0;

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;

  const dx = Math.abs(acc.x - lastAcc.x);
  const dy = Math.abs(acc.y - lastAcc.y);
  const dz = Math.abs(acc.z - lastAcc.z);
  const delta = dx + dy + dz;

  lastAcc = { x: acc.x, y: acc.y, z: acc.z };

  if (delta > SHAKE_THRESHOLD) {
    lastShakeTime = Date.now();
    clearTimeout(calmTimer);
    calmTimer = null;
    if (!isExploding && !isShattered) {
      explode();
    }
  } else if (delta < CALM_THRESHOLD) {
    if ((isShattered || isExploding) && !isReassembling && !calmTimer) {
      calmTimer = setTimeout(() => {
        calmTimer = null;
        reassemble();
      }, CALM_DURATION);
    }
  }
}

// Request permission on iOS 13+
function requestMotion() {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(state => {
        if (state === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
        }
      }).catch(console.error);
  } else {
    window.addEventListener('devicemotion', handleMotion);
  }
}
requestMotion();
document.body.addEventListener('touchstart', () => {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    requestMotion();
  }
}, { once: true });

// ─── DESKTOP BUTTON ───────────────────────────────────────────────────────────
function triggerShake() {
  if (!isExploding && !isShattered) {
    explode();
    setTimeout(() => reassemble(), 1800);
  } else if (isShattered) {
    reassemble();
  }
}
</script>
