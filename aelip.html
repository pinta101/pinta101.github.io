<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desafío AELIP</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --btn-blue: #4682B4;
            --btn-shadow: #2F4F4F;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--sky-blue);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 20%),
                radial-gradient(circle at 70% 20%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 25%),
                radial-gradient(circle at 40% 70%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 15%),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 20%),
                radial-gradient(circle at 10% 85%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 18%);
            background-attachment: fixed;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
        }

        #ui-layer {
            flex-shrink: 0;
            text-align: center;
            padding: 10px 15px;
            height: 160px;
            z-index: 100;
        }

        h1 { color: #ffffff; margin: 0; font-size: 1.1rem; text-transform: uppercase; text-shadow: 1px 1px 4px rgba(0,0,0,0.2); }
        #timer { font-size: 4rem; color: #ffffff; font-weight: bold; line-height: 1.1; }
        
        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            box-sizing: border-box;
            /* Margen inferior ajustado (reducido) */
            margin-bottom: 20px; 
        }

        .logo {
            position: absolute;
            height: auto;
            pointer-events: none;
            z-index: 5;
            animation: flash-animation 2.2s infinite ease-in-out;
        }

        @keyframes flash-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn-opcion {
            background-color: var(--btn-blue);
            border: 2px solid #ffffff;
            color: white;
            padding: 12px 25px; 
            margin: 5px;
            font-size: 20px; 
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 0 var(--btn-shadow);
            cursor: pointer;
        }

        .hidden { display: none !important; }

        #error-screen {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            text-align: center;
            background: rgba(70, 130, 180, 0.95);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #ffffff;
            z-index: 300;
        }

        /* Estilos para Fuegos Artificiales */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
            z-index: 999;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(40); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">AELIP - Lipodistrofias</h1>
        <div id="timer" class="hidden">5</div>
        <div id="options-container" class="hidden"></div>
        <button id="start-btn" class="btn-opcion" style="padding: 15px 35px; font-size: 24px;" onclick="startGame()">Comenzar</button>
    </div>

    <div id="game-area">
        <div id="error-screen" class="hidden">
            <h2 style="margin-top: 0;">¡Incorrecto!</h2>
            <p id="error-info"></p>
            <button class="btn-opcion" onclick="resetGame()">Reintentar</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const timerDisplay = document.getElementById('timer');
        const optionsContainer = document.getElementById('options-container');
        const startBtn = document.getElementById('start-btn');
        const errorScreen = document.getElementById('error-screen');
        const errorInfo = document.getElementById('error-info');
        
        const logoURL = "aelip.png"; 

        let currentLevel = 1;
        let correctCount = 0;
        let lastPieceCount = 4; 
        let timerInterval;
        let placedLogos = []; 

        function launchFullScreen(element) {
            if(element.requestFullscreen) element.requestFullscreen();
            else if(element.webkitRequestFullscreen) element.webkitRequestFullscreen();
        }

        function isOverlapping(newX, newY, newWidth, newHeight) {
            const padding = 5; 
            for (let logo of placedLogos) {
                if (newX < logo.x + logo.width + padding &&
                    newX + newWidth + padding > logo.x &&
                    newY < logo.y + logo.height + padding &&
                    newY + newHeight + padding > logo.y) {
                    return true; 
                }
            }
            return false;
        }

        function startGame() {
            launchFullScreen(document.documentElement);
            startBtn.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            lastPieceCount = 4; 
            errorScreen.classList.add('hidden');
            // Limpiar fuegos artificiales si existen de una victoria previa
            document.querySelectorAll('.firework').forEach(f => f.remove());
            nextLevel();
        }

        function nextLevel() {
            if (currentLevel > 10) { victory(); return; }

            document.getElementById('title').innerText = "Nivel " + currentLevel + " / 10";
            optionsContainer.classList.add('hidden');
            document.querySelectorAll('.logo').forEach(l => l.remove());
            placedLogos = []; 
            timerDisplay.classList.remove('hidden');

            let timeForLevel = currentLevel <= 3 ? 5 : (currentLevel <= 6 ? 10 : 15);
            let increment = Math.floor(Math.random() * 2) + 1; 
            correctCount = lastPieceCount + increment;
            lastPieceCount = correctCount;

            const areaW = gameArea.offsetWidth;
            const areaH = gameArea.offsetHeight;
            // Margen inferior de seguridad reducido para logos más grandes
            const safeMarginBottom = 40; 

            for (let i = 0; i < correctCount; i++) {
                const img = document.createElement('img');
                img.src = logoURL;
                img.className = 'logo';
                
                // LOGOS MÁS GRANDES: Ancho entre 65px y 95px
                const size = Math.floor(Math.random() * 30) + 65; 
                const w = size;
                const h_estimada = size * 1.2; 

                let x, y, attempts = 0;
                let overlaps = true;

                while (overlaps && attempts < 150) { // Aumentados intentos por tamaño mayor
                    x = Math.random() * (areaW - w);
                    y = Math.random() * (areaH - h_estimada - safeMarginBottom);
                    
                    if (y < 0) y = 0;
                    if (x < 0) x = 0;

                    overlaps = isOverlapping(x, y, w, h_estimada);
                    attempts++;
                }

                placedLogos.push({ x, y, width: w, height: h_estimada });

                img.style.width = w + "px";
                img.style.left = x + "px";
                img.style.top = y + "px";
                img.style.transform = "rotate(" + (Math.random() * 30 - 15) + "deg)";

                gameArea.appendChild(img);
            }

            startTimer(timeForLevel);
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            timerDisplay.innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showOptions();
                }
            }, 1000);
        }

        function showOptions() {
            document.querySelectorAll('.logo').forEach(l => l.remove());
            timerDisplay.classList.add('hidden');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            let choices = [correctCount - 1, correctCount, correctCount + 1];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.innerText = num;
                btn.onclick = () => {
                    if (parseInt(btn.innerText) === correctCount) {
                        currentLevel++;
                        nextLevel();
                    } else {
                        showError();
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        function showError() {
            optionsContainer.classList.add('hidden');
            errorScreen.classList.remove('hidden');
            errorInfo.innerText = "Había exactamente " + correctCount + " logos.";
        }

        function victory() {
            document.getElementById('title').innerText = "¡MAESTRO AELIP!";
            optionsContainer.innerHTML = '<button class="btn-opcion" onclick="resetGame()">Jugar de Nuevo</button>';
            optionsContainer.classList.remove('hidden');
            
            // ACTIVAR FUEGOS ARTIFICIALES
            // Crear fuegos artificiales cada 250ms durante la pantalla de victoria
            const fireworkInterval = setInterval(createFirework, 250);
            
            // Limpiar el intervalo si el usuario reinicia el juego
            const restartBtn = optionsContainer.querySelector('button');
            restartBtn.addEventListener('click', () => {
                clearInterval(fireworkInterval);
            });
        }

        // Función para crear Fuegos Artificiales
        function createFirework() {
            const colors = ['#ffffff', '#cccccc', '#dddddd']; // Tonos blancos y grises
            const fw = document.createElement('div');
            fw.className = 'firework';
            
            // Posición aleatoria en toda la pantalla
            fw.style.left = Math.random() * 100 + 'vw';
            fw.style.top = Math.random() * 100 + 'vh';
            
            // Color aleatorio de la lista
            const color = colors[Math.floor(Math.random() * colors.length)];
            fw.style.backgroundColor = color;
            fw.style.boxShadow = `0 0 15px 3px ${color}`;
            
            document.body.appendChild(fw);
            
            // Eliminar el elemento después de que termine la animación
            setTimeout(() => fw.remove(), 1000);
        }
    </script>
</body>
</html>
